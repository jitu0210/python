<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Learning – Code Browser &amp; Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --panel:#0b0b0b; --panel2:#111; --line:#222; --text:#e8e8e8; --muted:#8a8a8a;
          --accent:#7FFF00; --accent-dim:rgba(127,255,0,.12);
          --kw:#7FFF00; --str:#f9e2af; --num:#fab387; --com:#6c7086; --fn:#89dceb; --bi:#f5a6d6; --op:#cba6f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Outfit',system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--text);
         display:grid; grid-template-columns:300px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:16px 12px; }
  aside h1 { font-size:20px; font-weight:700; margin:0 6px 14px; color:var(--accent); }
  #search { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text);
            font:inherit; font-size:14px; margin-bottom:12px; outline:none; }
  #search:focus { border-color:var(--accent); }
  details { margin:2px 0; }
  summary { cursor:pointer; padding:6px 8px; border-radius:6px; font-weight:500; font-size:14px; }
  summary:hover { background:var(--panel2); }
  details[open] > summary { color:var(--accent); }
  aside a { display:block; padding:5px 8px 5px 22px; color:var(--muted); text-decoration:none; font-size:14px; border-radius:6px; border-left:2px solid transparent; }
  aside a:hover { color:var(--text); background:var(--panel2); }
  aside a.active { color:var(--accent); background:var(--accent-dim); border-left-color:var(--accent); font-weight:500; }
  mark { background:var(--accent); color:#000; border-radius:2px; padding:0 1px; }
  main { overflow:auto; padding:24px 32px; }
  .crumb { color:var(--muted); font-size:13px; margin-bottom:6px; font-family:'Fira Code',monospace; }
  h2.title { margin:0 0 18px; font-size:28px; font-weight:600; text-transform:capitalize; }
  h2.title::after { content:''; display:block; width:48px; height:3px; background:var(--accent); border-radius:2px; margin-top:8px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:20px; overflow:hidden; }
  .box-head { display:flex; justify-content:space-between; align-items:center; padding:9px 14px; border-bottom:1px solid var(--line);
              font-size:14px; color:var(--text); font-weight:500; background:var(--panel2); }
  pre.code { margin:0; padding:14px 0; overflow:auto; font:14px/1.6 'Fira Code',Consolas,monospace; }
  pre.code .ln { display:inline-block; width:46px; padding-right:14px; text-align:right; color:#444; user-select:none; }
  .kw{color:var(--kw);font-weight:500} .str{color:var(--str)} .num{color:var(--num)} .com{color:var(--com);font-style:italic}
  .fn{color:var(--fn)} .bi{color:var(--bi)} .op{color:var(--op)}
  .editwrap { position:relative; height:320px; resize:vertical; overflow:hidden; background:#050505; }
  .editwrap pre, .editwrap textarea { position:absolute; inset:0; margin:0; padding:14px; border:0; white-space:pre; overflow:auto;
               font:14px/1.6 'Fira Code',Consolas,monospace; tab-size:4; }
  .editwrap pre { pointer-events:none; color:var(--text); }
  .editwrap textarea { background:transparent; color:transparent; caret-color:var(--accent); resize:none; outline:none; }
  .editwrap textarea::selection { background:rgba(127,255,0,.25); color:transparent; }
  #output { margin:0; padding:14px; min-height:60px; max-height:400px; overflow:auto; font:14px/1.6 'Fira Code',Consolas,monospace; white-space:pre-wrap; }
  #output .err { color:#f38ba8; }
  button { background:var(--accent); color:#000; border:0; padding:6px 16px; border-radius:7px; cursor:pointer; font:600 13px 'Outfit',sans-serif; margin-left:6px; }
  button:hover { background:#9dff40; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  button.ghost:hover { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  .md { padding:6px 22px 14px; line-height:1.7; font-size:15px; }
  .md h2, .md h3, .md h4 { color:var(--accent); font-weight:600; }
  .md b { color:#fff; }
  .md code { background:var(--accent-dim); color:var(--accent); padding:1px 6px; border-radius:4px; font:13px 'Fira Code',monospace; }
  .md pre { background:#050505; border:1px solid var(--line); padding:12px; border-radius:8px; overflow:auto; }
  .md pre code { padding:0; background:none; color:var(--text); }
  .md a, .chapter-links a { color:var(--accent); }
  .md table { border-collapse:collapse; } .md td { border:1px solid var(--line); padding:6px 10px; }
  .md tr:first-child td { background:var(--panel2); font-weight:600; }
  .hint { color:var(--muted); font-size:12px; font-weight:400; }
  ::selection { background:var(--accent); color:#000; }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:5px; } ::-webkit-scrollbar-thumb:hover { background:#3a3a3a; }
  @media (max-width:800px){ body{grid-template-columns:1fr; height:auto;} aside{max-height:40vh;} }
</style>
</head>
<body>
<aside>
  <h1>🐍 Python Learning</h1>
  <input id="search" placeholder="Search files…">
  <nav id="tree"></nav>
</aside>
<main>
  <div class="crumb" id="crumb"></div>
  <h2 class="title" id="title">Select a file</h2>

    <div class="box-head"><span>📄 Code (read only)</span><button class="ghost" id="copyBtn">Copy</button></div>
    <pre class="code" id="code"></pre>
  </div>
  <div class="box">
    <div class="box-head">
      <span>▶ Python Playground <span class="hint">(edit freely · Ctrl+Enter to run · runs in your browser)</span></span>
      <span><button class="ghost" id="resetBtn">Reset</button><button id="runBtn">Run ▶</button></span>
    </div>
    <div class="editwrap"><pre id="editHL" aria-hidden="true"></pre><textarea id="editor" wrap="off" spellcheck="false" placeholder="# write Python here and press Run&#10;print('Hello, World!')"></textarea></div>
  </div>
  <div class="box">
    <div class="box-head"><span>🖥 Output</span><button class="ghost" id="clearBtn">Clear</button></div>
    <pre id="output"><span class="hint">Output will appear here.</span></pre>
  </div>
</main>

<script id="files" type="application/json">{"README.md": "# Python Tutorial; the files inside are its\ndropdown topics, in order. Run any lesson with: `python <folder>/<file>.py`\n\n- **[01_Python_Intro](01_Python_Intro/)** - Python Intro\n    - Intro\n- **[02_Python_Get_Started](02_Python_Get_Started/)** - Python Get Started\n    - Get Started\n- **[03_Python_Syntax](03_Python_Syntax/)** - Python Syntax\n    - Syntax\n    - Statements\n- **[04_Python_Output](04_Python_Output/)** - Python Output\n    - Print Text\n    - Print Numbers\n- **[05_Python_Comments](05_Python_Comments/)** - Python Comments\n    - Comments\n- **[06_Python_Variables](06_Python_Variables/)** - Python Variables\n    - Variables\n    - Variable Names\n    - Assign Multiple Values\n    - Output Variables\n    - Global Variables\n- **[07_Python_Data_Types](07_Python_Data_Types/)** - Python Data Types\n    - Data Types\n- **[08_Python_Numbers](08_Python_Numbers/)** - Python Numbers\n    - Numbers\n- **[09_Python_Casting](09_Python_Casting/)** - Python Casting\n    - Casting\n- **[10_Python_Strings](10_Python_Strings/)** - Python Strings\n    - Strings\n    - Slicing Strings\n    - Modify Strings\n    - Concatenate Strings\n    - Format Strings\n    - Escape Characters\n    - String Methods\n- **[11_Python_Booleans](11_Python_Booleans/)** - Python Booleans\n    - Booleans\n- **[12_Python_Operators](12_Python_Operators/)** - Python Operators\n    - Operators\n    - Arithmetic Operators\n    - Assignment Operators\n    - Ternary Operator\n    - Comparison Operators\n    - Logical Operators\n    - Identity Operators\n    - Membership Operators\n    - Bitwise Operators\n    - Operator Precedence\n- **[13_Python_Lists](13_Python_Lists/)** - Python Lists\n    - Lists\n    - Access List Items\n    - Change List Items\n    - __add__ List Items\n    - Remove List Items\n    - Loop Lists\n    - List Comprehension\n    - Sort Lists\n    - Copy Lists\n    - Join Lists\n    - List Methods\n- **[14_Python_Tuples](14_Python_Tuples/)** - Python Tuples\n    - Tuples\n    - Access Tuples\n    - Update Tuples\n    - Unpack Tuples\n    - Loop Tuples\n    - Join Tuples\n    - Tuple Methods\n- **[15_Python_Sets](15_Python_Sets/)** - Python Sets\n    - Sets\n    - Access Set Items\n    - __add__ Set Items\n    - Remove Set Items\n    - Loop Sets\n    - Join Sets\n    - Frozenset\n    - Set Methods\n- **[16_Python_Dictionaries](16_Python_Dictionaries/)** - Python Dictionaries\n    - Dictionaries\n    - Access Items\n    - Change Items\n    - __add__ Items\n    - Remove Items\n    - Loop Dictionaries\n    - Copy Dictionaries\n    - Nested Dictionaries\n    - Dictionary Methods\n- **[17_Python_If_Else](17_Python_If_Else/)** - Python If...Else\n    - If\n    - Elif\n    - Else\n    - Shorthand If\n    - Logical Operators\n    - Nested If\n    - Pass Statement\n- **[18_Python_Match](18_Python_Match/)** - Python Match\n    - Match\n- **[19_Python_While_Loops](19_Python_While_Loops/)** - Python While Loops\n    - While Loops\n- **[20_Python_For_Loops](20_Python_For_Loops/)** - Python For Loops\n    - For Loops\n- **[21_Python_Functions](21_Python_Functions/)** - Python Functions\n    - Functions\n    - Arguments\n    - *args **kwargs\n    - Scope\n    - Decorators\n    - Lambda\n    - Recursion\n    - Generators\n- **[22_Python_Range](22_Python_Range/)** - Python Range\n    - Range\n- **[23_Python_Arrays](23_Python_Arrays/)** - Python Arrays\n    - Arrays\n- **[24_Python_Iterators](24_Python_Iterators/)** - Python Iterators\n    - Iterators\n- **[25_Python_Modules](25_Python_Modules/)** - Python Modules\n    - Modules\n- **[26_Python_Dates](26_Python_Dates/)** - Python Dates\n    - Dates\n- **[27_Python_Math](27_Python_Math/)** - Python Math\n    - Math\n- **[28_Python_JSON](28_Python_JSON/)** - Python JSON\n    - JSON\n- **[29_Python_RegEx](29_Python_RegEx/)** - Python RegEx\n    - RegEx\n- **[30_Python_PIP](30_Python_PIP/)** - Python PIP\n    - PIP\n- **[31_Python_Try_Except](31_Python_Try_Except/)** - Python Try...Except\n    - Try Except\n- **[32_Python_String_Formatting](32_Python_String_Formatting/)** - Python String Formatting\n    - String Formatting\n- **[33_Python_None](33_Python_None/)** - Python None\n    - None\n- **[34_Python_User_Input](34_Python_User_Input/)** - Python User Input\n    - User Input\n- **[35_Python_VirtualEnv](35_Python_VirtualEnv/)** - Python VirtualEnv\n    - VirtualEnv\n- **[36_Python_OOP](36_Python_OOP/)** - Python OOP\n    - OOP\n- **[37_Python_Classes_Objects](37_Python_Classes_Objects/)** - Python Classes/Objects\n    - Classes Objects\n- **[38_Python_init_Method](38_Python_init_Method/)** - Python __init__ Method\n    - __init__ Method\n- **[39_Python_self_Parameter](39_Python_self_Parameter/)** - Python self Parameter\n    - self Parameter\n- **[40_Python_Class_Properties](40_Python_Class_Properties/)** - Python Class Properties\n    - Class Properties\n- **[41_Python_Class_Methods](41_Python_Class_Methods/)** - Python Class Methods\n    - Class Methods\n- **[42_Python_Magic_Methods](42_Python_Magic_Methods/)** - Python Magic Methods\n    - Magic Methods\n    - __str__\n    - __repr__\n    - __eq__\n    - __add__\n    - __len__\n    - __lt__\n    - __contains__\n    - __call__\n- **[43_Python_Inheritance](43_Python_Inheritance/)** - Python Inheritance\n    - Inheritance\n- **[44_Python_Polymorphism](44_Python_Polymorphism/)** - Python Polymorphism\n    - Polymorphism\n- **[45_Python_Encapsulation](45_Python_Encapsulation/)** - Python Encapsulation\n    - Encapsulation\n- **[46_Python_Inner_Classes](46_Python_Inner_Classes/)** - Python Inner Classes\n    - Inner Classes\n- **[47_Python_File_Handling](47_Python_File_Handling/)** - Python File Handling\n    - File Handling\n- **[48_Python_Read_Files](48_Python_Read_Files/)** - Python Read Files\n    - Read Files\n- **[49_Python_Write_Create_Files](49_Python_Write_Create_Files/)** - Python Write/Create Files\n    - Write Create Files\n- **[50_Python_Delete_Files](50_Python_Delete_Files/)** - Python Delete Files\n    - Delete Files\n", "build_page.py": "\"\"\"Build index.html: a single page that lists every file in this repo,\nshows the code with highlighting, and runs Python in the browser (Pyodide).\n\nRun:  python build_page.py   -> then open index.html in a browser.\n\"\"\"\nimport json\nimport os\n\nROOT = os.path.dirname(os.path.abspath(__file__))\nSKIP_DIRS = {\".git\", \".venv\", \"venv\", \"__pycache__\", \".claude\", \".planning\"}\nEXTS = {\".py\", \".md\", \".txt\", \".json\"}\n\nfiles = {}\nfor dirpath, dirnames, filenames in os.walk(ROOT):\n    dirnames[:] = sorted(d for d in dirnames if d not in SKIP_DIRS)\n    for name in sorted(filenames):\n        if os.path.splitext(name)[1] not in EXTS:\n            continue\n        full = os.path.join(dirpath, name)\n        rel = os.path.relpath(full, ROOT).replace(os.sep, \"/\")\n        with open(full, encoding=\"utf-8\", errors=\"replace\") as f:\n            files[rel] = f.read()\n\ndata = json.dumps(files, ensure_ascii=False).replace(\"<\/\", \"<\\\\/\")\n\nwith open(os.path.join(ROOT, \"page_template.html\"), encoding=\"utf-8\") as f:\n    template = f.read()\n\nwith open(os.path.join(ROOT, \"index.html\"), \"w\", encoding=\"utf-8\") as f:\n    f.write(template.replace(\"__FILES_JSON__\", data))\n\nprint(f\"index.html built with {len(files)} files\")\n", "01_Python_Intro/01_intro.py": "# ==========================================================\n# PYTHON INTRODUCTION\n# ==========================================================\n# Python is a popular programming language created by Guido van Rossum\n# and first released in 1991.\n#\n# What can Python do?\n#   - build web applications (server side)\n#   - automate tasks and write scripts\n#   - work with databases, read and change files\n#   - handle big data and complex mathematics\n#   - prototype quickly, or build production-ready software\n#\n# Why Python?\n#   - runs on Windows, Mac, Linux, Raspberry Pi and more\n#   - simple syntax, close to plain English\n#   - programs are usually shorter than in many other languages\n#   - runs on an interpreter, so code executes as soon as it is written\n#   - supports procedural, object-oriented and functional styles\n#\n# Python syntax compared to other languages:\n#   - a new line ends a command (no semicolons needed)\n#   - INDENTATION (whitespace) defines blocks such as loops, functions\n#     and classes - other languages use curly brackets { } for this\n\nprint(\"Hello, World!\")\n", "01_Python_Intro/README.md": "# 01. Python Intro\n\nTopics in this folder (in order):\n\n1. Intro - `01_intro.py`\n", "02_Python_Get_Started/01_get_started.py": "# ==========================================================\n# PYTHON GET STARTED\n# ==========================================================\n# 1) Check if Python is installed. Open a terminal / command prompt and type:\n#        python --version\n#    If it is missing, download it free from https://www.python.org\n#\n# 2) Python is an interpreted language: you write .py files in a text editor\n#    and then run them with the interpreter:\n#        python 01_get_started.py\n#\n# 3) The Python command line (interactive shell):\n#    type `python` in a terminal, then type code directly:\n#        >>> print(\"Hello\")\n#        Hello\n#    Type exit() to leave the shell.\n\nprint(\"Hello, World!\")\n\n# You can also check the version from inside a program:\nimport sys\nprint(\"Running Python\", sys.version.split()[0])\n", "02_Python_Get_Started/README.md": "# 02. Python Get Started\n\nTopics in this folder (in order):\n\n1. Get Started - `01_get_started.py`\n", "03_Python_Syntax/01_syntax.py": "# ==========================================================\n# PYTHON SYNTAX\n# ==========================================================\n\n# ---------- Execute Python syntax ----------\n# You can run code in the interactive shell (>>> print(\"Hi\"))\n# or save it in a .py file and run: python 01_syntax.py\n\n# ---------- Python Indentation ----------\n# Indentation = the spaces at the beginning of a code line.\n# In other languages it is only for readability; in Python it is REQUIRED,\n# because it tells Python which lines belong to a block.\n\nif 5 > 2:\n    print(\"Five is greater than two!\")\n\n# Missing indentation -> IndentationError:\n# if 5 > 2:\n# print(\"Five is greater than two!\")\n\n# You choose how many spaces (4 is the convention, at least 1 is required)\nif 5 > 2:\n print(\"One space works\")\nif 5 > 2:\n        print(\"Eight spaces work too\")\n\n# But inside ONE block you must use the same amount:\n# if 5 > 2:\n#     print(\"four spaces\")\n#         print(\"eight spaces\")   # IndentationError\n\n# ---------- Python Variables ----------\n# Variables are created when you assign a value (no declaration command)\nx = 5\ny = \"Hello, World!\"\nprint(x, y)\n\n# ---------- Comments ----------\n# A line starting with # is a comment and is ignored by Python.\nprint(\"Syntax lesson finished\")\n", "03_Python_Syntax/02_statements.py": "# ==========================================================\n# PYTHON STATEMENTS\n# ==========================================================\n# A computer program is a list of instructions.\n# In Python each instruction is called a STATEMENT.\n\nprint(\"Python is fun!\")          # one statement\n\n# Most programs contain many statements, executed one by one, top to bottom:\nprint(\"Line one\")\nprint(\"Line two\")\nprint(\"Line three\")\n\n# ---------- Semicolons ----------\n# Python statements end at the end of the line - no semicolon is needed.\n# You CAN use semicolons to put several statements on one line:\nprint(\"A\"); print(\"B\"); print(\"C\")\n# ...but it is not recommended, it makes code harder to read.\n\n# ---------- Long statements ----------\n# Statements can continue over several lines inside brackets ( ) [ ] { }\ntotal = (1 + 2 + 3 +\n         4 + 5 + 6)\nprint(total)\n\n# ...or with a backslash at the end of the line\ntotal = 10 + \\\n        20\nprint(total)\n", "03_Python_Syntax/README.md": "# 03. Python Syntax\n\nTopics in this folder (in order):\n\n1. Syntax - `01_syntax.py`\n2. Statements - `02_statements.py`\n", "04_Python_Output/01_print_text.py": "# ==========================================================\n# PYTHON OUTPUT - PRINT TEXT\n# ==========================================================\n# The print() function displays output on the screen.\n\nprint(\"Hello World!\")\n\n# Text must be inside quotes - single or double, both work:\nprint(\"Double quotes\")\nprint('Single quotes')\n\n# Every print() starts on a new line by default:\nprint(\"First line\")\nprint(\"Second line\")\n\n# Print several values: separate them with commas (a space is added between)\nprint(\"I\", \"am\", \"learning\", \"Python\")\n\n# Change the separator with sep=\nprint(\"2026\", \"11\", \"16\", sep=\"-\")\n\n# Print on the same line with end=  (default end is a new line \"\\n\")\nprint(\"Hello\", end=\" \")\nprint(\"World!\")\n\n# Empty print() gives an empty line\nprint()\nprint(\"After a blank line\")\n", "04_Python_Output/02_print_numbers.py": "# ==========================================================\n# PYTHON OUTPUT - PRINT NUMBERS\n# ==========================================================\n# Numbers are printed WITHOUT quotes:\nprint(3)\nprint(358)\nprint(50000)\nprint(2.75)\n\n# You can do math directly inside print():\nprint(3 + 3)\nprint(2 * 5)\nprint(10 / 4)\n\n# A number inside quotes is TEXT, not a number:\nprint(\"3 + 3\")     # prints the text 3 + 3\nprint(3 + 3)       # prints 6\n\n# Mix text and numbers with a comma:\nprint(\"I am\", 35, \"years old.\")\nprint(\"Total:\", 4 * 25)\n", "04_Python_Output/README.md": "# 04. Python Output\n\nTopics in this folder (in order):\n\n1. Print Text - `01_print_text.py`\n2. Print Numbers - `02_print_numbers.py`\n", "05_Python_Comments/01_comments.py": "# ==========================================================\n# PYTHON COMMENTS\n# ==========================================================\n# Comments can be used to:\n#   - explain code\n#   - make code more readable\n#   - stop code from running while you test\n\n# ---------- Creating a comment ----------\n# A comment starts with #, Python ignores the rest of that line.\nprint(\"Hello, World!\")\n\nprint(\"Hello, again!\")  # a comment can also be at the end of a line\n\n# Use # to stop a line of code from running:\n# print(\"This will not be printed\")\nprint(\"Only this is printed\")\n\n# ---------- Multi-line comments ----------\n# Python has no special multi-line comment syntax.\n# Option 1: put a # in front of each line\n# like this\n# and this\n\n# Option 2: a string literal that is not assigned to a variable is ignored,\n# so a triple-quoted string can act as a multi-line comment:\n\"\"\"\nThis is a comment\nwritten over\nmore than one line\n\"\"\"\nprint(\"Comments lesson finished\")\n", "05_Python_Comments/README.md": "# 05. Python Comments\n\nTopics in this folder (in order):\n\n1. Comments - `01_comments.py`\n", "06_Python_Variables/01_variables.py": "# ==========================================================\n# PYTHON VARIABLES\n# ==========================================================\n# Variables are containers for storing data values.\n\n# ---------- Creating variables ----------\n# There is no command for declaring a variable.\n# A variable is created the moment you first assign a value to it.\nx = 5\ny = \"Ravi\"\nprint(x)\nprint(y)\n\n# Variables don't need a declared type, and can even change type:\nx = 4        # x is an int\nx = \"Sita\"   # x is now a str\nprint(x)\n\n# ---------- Casting ----------\n# Choose the data type yourself:\na = str(3)    # '3'\nb = int(3)    # 3\nc = float(3)  # 3.0\nprint(a, b, c)\n\n# ---------- Get the type ----------\nprint(type(b))\nprint(type(y))\n\n# ---------- Single or double quotes? ----------\nname = \"Ravi\"\nname = 'Ravi'     # exactly the same\n\n# ---------- Case-sensitive ----------\nage = 4\nAge = \"Old\"       # Age does NOT overwrite age\nprint(age, Age)\n", "06_Python_Variables/02_variable_names.py": "# ==========================================================\n# VARIABLE NAMES\n# ==========================================================\n# A variable can have a short name (x, y) or a descriptive one (car_name).\n# Rules:\n#   - must start with a letter or the underscore _\n#   - cannot start with a number\n#   - can only contain letters, numbers and underscores (A-z, 0-9, _)\n#   - names are case-sensitive (age, Age and AGE are three variables)\n#   - cannot be a Python keyword (if, for, while, class, def, ...)\n\n# Legal names:\nmyvar = \"Ravi\"\nmy_var = \"Ravi\"\n_my_var = \"Ravi\"\nmyVar = \"Ravi\"\nMYVAR = \"Ravi\"\nmyvar2 = \"Ravi\"\n\n# Illegal names (would cause SyntaxError):\n# 2myvar = \"Ravi\"\n# my-var = \"Ravi\"\n# my var = \"Ravi\"\n\n# ---------- Multi-word variable names ----------\n# Camel case: each word except the first starts with a capital\nmyVariableName = \"Camel\"\n# Pascal case: each word starts with a capital\nMyVariableName = \"Pascal\"\n# Snake case: words separated by underscores (most common in Python)\nmy_variable_name = \"Snake\"\n\nprint(myVariableName, MyVariableName, my_variable_name)\n", "06_Python_Variables/03_assign_multiple_values.py": "# ==========================================================\n# ASSIGN MULTIPLE VALUES\n# ==========================================================\n\n# ---------- Many values to multiple variables ----------\n# The number of variables must match the number of values.\nx, y, z = \"Mango\", \"Grape\", \"Guava\"\nprint(x)\nprint(y)\nprint(z)\n\n# ---------- One value to multiple variables ----------\nx = y = z = \"Mango\"\nprint(x)\nprint(y)\nprint(z)\n\n# ---------- Unpack a collection ----------\n# Values in a list / tuple can be extracted into variables (unpacking).\nfruits = [\"mango\", \"grape\", \"guava\"]\nx, y, z = fruits\nprint(x)\nprint(y)\nprint(z)\n", "06_Python_Variables/04_output_variables.py": "# ==========================================================\n# OUTPUT VARIABLES\n# ==========================================================\n# print() is used to output variables.\nx = \"Python is awesome\"\nprint(x)\n\n# Output several variables separated by commas:\nx = \"Python\"\ny = \"is\"\nz = \"awesome\"\nprint(x, y, z)\n\n# The + operator also joins strings (note: no automatic spaces):\nprint(x + \" \" + y + \" \" + z)\n\n# For numbers, + is a math operator:\na = 5\nb = 10\nprint(a + b)\n\n# Mixing a string and a number with + gives an error:\n# print(5 + \"Ravi\")     # TypeError\n\n# The comma works with different types:\nprint(a, \"Ravi\")\n", "06_Python_Variables/05_global_variables.py": "# ==========================================================\n# GLOBAL VARIABLES\n# ==========================================================\n# Variables created OUTSIDE of a function are global variables.\n# They can be used everywhere, inside and outside functions.\n\nx = \"awesome\"\n\ndef myfunc():\n    print(\"Python is \" + x)\n\nmyfunc()\n\n# A variable with the same name created INSIDE a function is local.\n# The global variable keeps its original value.\nx = \"awesome\"\n\ndef myfunc2():\n    x = \"fantastic\"           # local\n    print(\"Python is \" + x)\n\nmyfunc2()\nprint(\"Python is \" + x)       # still \"awesome\"\n\n# ---------- The global keyword ----------\n# Use `global` to create a global variable inside a function:\ndef myfunc3():\n    global y\n    y = \"brilliant\"\n\nmyfunc3()\nprint(\"Python is \" + y)\n\n# ...or to CHANGE a global variable inside a function:\nx = \"awesome\"\n\ndef myfunc4():\n    global x\n    x = \"fantastic\"\n\nmyfunc4()\nprint(\"Python is \" + x)       # now \"fantastic\"\n", "06_Python_Variables/README.md": "# 06. Python Variables\n\nTopics in this folder (in order):\n\n1. Variables - `01_variables.py`\n2. Variable Names - `02_variable_names.py`\n3. Assign Multiple Values - `03_assign_multiple_values.py`\n4. Output Variables - `04_output_variables.py`\n5. Global Variables - `05_global_variables.py`\n", "07_Python_Data_Types/01_data_types.py": "# ==========================================================\n# PYTHON DATA TYPES\n# ==========================================================\n# Variables store data of different types. Built-in types:\n#   Text Type:       str\n#   Numeric Types:   int, float, complex\n#   Sequence Types:  list, tuple, range\n#   Mapping Type:    dict\n#   Set Types:       set, frozenset\n#   Boolean Type:    bool\n#   Binary Types:    bytes, bytearray, memoryview\n#   None Type:       NoneType\n\n# ---------- Getting the data type ----------\nx = 5\nprint(type(x))\n\n# ---------- Setting the data type ----------\n# The type is set when you assign a value:\nexamples = [\n    \"Hello World\",                 # str\n    20,                            # int\n    20.5,                          # float\n    1j,                            # complex\n    [\"apple\", \"banana\"],           # list\n    (\"apple\", \"banana\"),           # tuple\n    range(6),                      # range\n    {\"name\": \"Ravi\", \"age\": 36},   # dict\n    {\"apple\", \"banana\"},           # set\n    frozenset({\"apple\", \"banana\"}),# frozenset\n    True,                          # bool\n    b\"Hello\",                      # bytes\n    bytearray(5),                  # bytearray\n    memoryview(bytes(5)),          # memoryview\n    None,                          # NoneType\n]\nfor value in examples:\n    print(f\"{str(value):35} {type(value).__name__}\")\n\n# ---------- Setting a specific data type ----------\n# Use the constructor functions:\nx = str(\"Hello World\")\nx = int(20)\nx = float(20.5)\nx = complex(1j)\nx = list((\"apple\", \"banana\"))\nx = tuple((\"apple\", \"banana\"))\nx = range(6)\nx = dict(name=\"Ravi\", age=36)\nx = set((\"apple\", \"banana\"))\nx = frozenset((\"apple\", \"banana\"))\nx = bool(5)\nx = bytes(5)\nx = bytearray(5)\nx = memoryview(bytes(5))\nprint(type(x))\n", "07_Python_Data_Types/README.md": "# 07. Python Data Types\n\nTopics in this folder (in order):\n\n1. Data Types - `01_data_types.py`\n", "08_Python_Numbers/01_numbers.py": "# ==========================================================\n# PYTHON NUMBERS\n# ==========================================================\n# There are three numeric types: int, float, complex\nx = 1      # int\ny = 2.8    # float\nz = 1j     # complex\nprint(type(x), type(y), type(z))\n\n# ---------- Int ----------\n# Whole number, positive or negative, without decimals, unlimited length\nx = 1\ny = 35656222554887711\nz = -3255522\nprint(x, y, z)\n\n# ---------- Float ----------\n# Number with one or more decimals\nx = 1.10\ny = 1.0\nz = -35.59\nprint(x, y, z)\n\n# Floats can be scientific numbers with \"e\" = power of 10\nx = 35e3      # 35000.0\ny = 12E4      # 120000.0\nz = -87.7e100\nprint(x, y, z)\n\n# ---------- Complex ----------\n# Written with \"j\" as the imaginary part\nx = 3 + 5j\ny = 5j\nz = -5j\nprint(x, y, z)\n\n# ---------- Type conversion ----------\nx = 1\ny = 2.8\nz = 1j\na = float(x)    # int -> float\nb = int(y)      # float -> int (decimals are cut off)\nc = complex(x)  # int -> complex\nprint(a, b, c)\n# You cannot convert complex numbers into another number type.\n\n# ---------- Random number ----------\n# Python has a built-in module called random:\nimport random\nprint(random.randrange(1, 10))\n", "08_Python_Numbers/README.md": "# 08. Python Numbers\n\nTopics in this folder (in order):\n\n1. Numbers - `01_numbers.py`\n", "09_Python_Casting/01_casting.py": "# ==========================================================\n# PYTHON CASTING\n# ==========================================================\n# Python is object-oriented: data types are classes.\n# Casting is done with constructor functions:\n#   int()   - builds an int from an int, a float (removes decimals),\n#             or a string that holds a whole number\n#   float() - builds a float from an int, float, or a numeric string\n#   str()   - builds a string from strings, ints, floats and more\n\n# Integers\nx = int(1)     # 1\ny = int(2.8)   # 2\nz = int(\"3\")   # 3\nprint(x, y, z)\n\n# Floats\nx = float(1)      # 1.0\ny = float(2.8)    # 2.8\nz = float(\"3\")    # 3.0\nw = float(\"4.2\")  # 4.2\nprint(x, y, z, w)\n\n# Strings\nx = str(\"s1\")  # 's1'\ny = str(2)     # '2'\nz = str(3.0)   # '3.0'\nprint(x, y, z)\n\n# A string that is not a number cannot become an int:\ntry:\n    int(\"abc\")\nexcept ValueError as e:\n    print(\"ValueError:\", e)\n", "09_Python_Casting/README.md": "# 09. Python Casting\n\nTopics in this folder (in order):\n\n1. Casting - `01_casting.py`\n", "10_Python_Strings/01_strings.py": "# ==========================================================\n# PYTHON STRINGS\n# ==========================================================\n# Strings are surrounded by single or double quotes. 'hello' == \"hello\"\nprint(\"Hello\")\nprint('Hello')\n\n# ---------- Quotes inside quotes ----------\nprint(\"It's alright\")\nprint(\"He is called 'Johnny'\")\nprint('He is called \"Johnny\"')\n\n# ---------- Assign a string to a variable ----------\na = \"Hello\"\nprint(a)\n\n# ---------- Multiline strings ----------\na = \"\"\"Lorem ipsum dolor sit amet,\nconsectetur adipiscing elit,\nsed do eiusmod tempor.\"\"\"\nprint(a)\n\n# ---------- Strings are arrays ----------\n# A string is an array of characters. Square brackets access an element.\n# (Python has no separate \"character\" type - a character is a string of length 1.)\na = \"Hello, World!\"\nprint(a[1])          # e  (first position is 0)\n\n# ---------- Looping through a string ----------\nfor ch in \"banana\":\n    print(ch)\n\n# ---------- String length ----------\nprint(len(a))\n\n# ---------- Check string ----------\ntxt = \"The best things in life are free!\"\nprint(\"free\" in txt)\nif \"free\" in txt:\n    print(\"Yes, 'free' is present.\")\n\n# ---------- Check if NOT ----------\nprint(\"expensive\" not in txt)\nif \"expensive\" not in txt:\n    print(\"No, 'expensive' is NOT present.\")\n", "10_Python_Strings/02_slicing_strings.py": "# ==========================================================\n# SLICING STRINGS\n# ==========================================================\n# Return a range of characters with  string[start:end]\n# start is INCLUDED, end is NOT included.\nb = \"Hello, World!\"\nprint(b[2:5])     # llo\n\n# ---------- Slice from the start ----------\nprint(b[:5])      # Hello\n\n# ---------- Slice to the end ----------\nprint(b[2:])      # llo, World!\n\n# ---------- Negative indexing ----------\n# Count from the end of the string (-1 is the last character)\nprint(b[-5:-2])   # orl\n\n# ---------- Step ----------\nprint(b[::2])     # every second character\nprint(b[::-1])    # reversed string\n", "10_Python_Strings/03_modify_strings.py": "# ==========================================================\n# MODIFY STRINGS\n# ==========================================================\n# Python has built-in methods for working with strings.\n# (Strings are immutable - methods RETURN a new string.)\n\na = \"Hello, World!\"\n\n# Upper case\nprint(a.upper())\n\n# Lower case\nprint(a.lower())\n\n# Remove whitespace at the beginning/end\nb = \"   Hello, World!   \"\nprint(b.strip())\n\n# Replace a string with another string\nprint(a.replace(\"H\", \"J\"))\n\n# Split a string into a list, using a separator\nprint(a.split(\",\"))     # ['Hello', ' World!']\n", "10_Python_Strings/04_concatenate_strings.py": "# ==========================================================\n# STRING CONCATENATION\n# ==========================================================\n# Use + to combine (concatenate) two strings.\na = \"Hello\"\nb = \"World\"\nc = a + b\nprint(c)          # HelloWorld\n\n# Add a space between them:\nc = a + \" \" + b\nprint(c)          # Hello World\n", "10_Python_Strings/05_format_strings.py": "# ==========================================================\n# FORMAT STRINGS\n# ==========================================================\n# We cannot combine strings and numbers with +\nage = 36\n# txt = \"My name is Ravi, I am \" + age    # TypeError\n\n# ---------- F-Strings (Python 3.6+) ----------\n# Put an f before the string and {placeholders} inside it.\ntxt = f\"My name is Ravi, I am {age}\"\nprint(txt)\n\n# ---------- Placeholders and modifiers ----------\nprice = 59\nprint(f\"The price is {price} dollars\")\n\n# Modifier :.2f -> fixed point with 2 decimals\nprint(f\"The price is {price:.2f} dollars\")\n\n# Placeholders can hold expressions / math / function calls\nprint(f\"The price is {20 * 59} dollars\")\n", "10_Python_Strings/06_escape_characters.py": "# ==========================================================\n# ESCAPE CHARACTERS\n# ==========================================================\n# To put characters that are not allowed into a string, use an escape\n# character: a backslash \\ followed by the character.\n\n# txt = \"We are the so-called \"Vikings\" from the north.\"   # error\ntxt = \"We are the so-called \\\"Vikings\\\" from the north.\"\nprint(txt)\n\n# Other escape characters:\nprint('It\\'s alright.')          # \\'  single quote\nprint(\"A backslash: \\\\\")         # \\\\  backslash\nprint(\"Hello\\nWorld!\")           # \\n  new line\nprint(\"Hello\\rWorld!\")           # \\r  carriage return\nprint(\"Hello\\tWorld!\")           # \\t  tab\nprint(\"Hello \\bWorld!\")          # \\b  backspace\nprint(\"\\110\\145\\154\\154\\157\")      # \\ooo octal value  -> Hello\nprint(\"\\x48\\x65\\x6c\\x6c\\x6f\")      # \\xhh hex value    -> Hello\n", "10_Python_Strings/07_string_methods.py": "# ==========================================================\n# STRING METHODS\n# ==========================================================\n# All string methods return NEW values; the original string is unchanged.\nt = \"hello, welcome to my world.\"\n\nprint(t.capitalize())              # first character upper case\nprint(t.casefold())                # lower case (aggressive)\nprint(t.center(35, \"*\"))           # centered string\nprint(t.count(\"o\"))                # times a value occurs\nprint(t.encode())                  # encoded version (bytes)\nprint(t.endswith(\".\"))             # ends with value?\nprint(\"H\\te\\tl\".expandtabs(4))     # set tab size\nprint(t.find(\"welcome\"))           # position, -1 if not found\nprint(\"{} is {}\".format(\"Ravi\", 36))  # format values\nprint(t.index(\"welcome\"))          # like find(), but error if missing\nprint(\"abc123\".isalnum())          # all alphanumeric?\nprint(\"abc\".isalpha())             # all letters?\nprint(\"abc\".isascii())             # all ASCII?\nprint(\"2\".isdecimal())             # all decimals?\nprint(\"12\".isdigit())              # all digits?\nprint(\"my_var\".isidentifier())     # valid identifier?\nprint(\"abc\".islower())             # all lower case?\nprint(\"12\".isnumeric())            # all numeric?\nprint(\"Hi!\".isprintable())         # all printable?\nprint(\"   \".isspace())             # all whitespace?\nprint(\"Hello World\".istitle())     # title case?\nprint(\"ABC\".isupper())             # all upper case?\nprint(\"-\".join([\"a\", \"b\", \"c\"]))   # join an iterable\nprint(\"hi\".ljust(10, \".\") + \"|\")   # left justified\nprint(\"HeLLo\".lower())             # lower case\nprint(\"  hi\".lstrip())             # left trim\ntbl = str.maketrans(\"a\", \"4\")      # translation table\nprint(\"banana\".translate(tbl))     # translate using table\nprint(t.partition(\"welcome\"))      # split into 3-part tuple\nprint(t.replace(\"world\", \"home\"))  # replace\nprint(t.rfind(\"o\"))                # last position\nprint(t.rindex(\"o\"))               # last position (error if missing)\nprint(\"hi\".rjust(10, \".\")) # right justified\nprint(t.rpartition(\"o\"))           # partition at last occurrence\nprint(\"a,b,c\".rsplit(\",\", 1))      # split from the right\nprint(\"hi  \".rstrip() + \"|\")       # right trim\nprint(\"a,b,c\".split(\",\"))          # split\nprint(\"line1\\nline2\".splitlines())  # split at line breaks\nprint(t.startswith(\"hello\"))       # starts with value?\nprint(\"  hi  \".strip())            # trim both sides\nprint(\"HeLLo\".swapcase())          # swap case\nprint(t.title())                   # first letter of each word upper\nprint(t.upper())                   # upper case\nprint(\"42\".zfill(5))               # fill with zeros at the start\n", "10_Python_Strings/README.md": "# 10. Python Strings\n\nTopics in this folder (in order):\n\n1. Strings - `01_strings.py`\n2. Slicing Strings - `02_slicing_strings.py`\n3. Modify Strings - `03_modify_strings.py`\n4. Concatenate Strings - `04_concatenate_strings.py`\n5. Format Strings - `05_format_strings.py`\n6. Escape Characters - `06_escape_characters.py`\n7. String Methods - `07_string_methods.py`\n", "11_Python_Booleans/01_booleans.py": "# ==========================================================\n# PYTHON BOOLEANS\n# ==========================================================\n# Booleans represent one of two values: True or False.\n\n# ---------- Boolean values ----------\n# Comparing values returns a Boolean:\nprint(10 > 9)    # True\nprint(10 == 9)   # False\nprint(10 < 9)    # False\n\n# In an if statement:\na = 200\nb = 33\nif b > a:\n    print(\"b is greater than a\")\nelse:\n    print(\"b is not greater than a\")\n\n# ---------- Evaluate values and variables ----------\nprint(bool(\"Hello\"))\nprint(bool(15))\nx = \"Hello\"\ny = 15\nprint(bool(x), bool(y))\n\n# ---------- Most values are True ----------\n# Any string except \"\", any number except 0, any non-empty collection.\nprint(bool(\"abc\"), bool(123), bool([\"apple\", \"cherry\"]))\n\n# ---------- Some values are False ----------\nprint(bool(False), bool(None), bool(0), bool(\"\"),\n      bool(()), bool([]), bool({}))\n\n# An object whose class defines __len__ returning 0 is also False:\nclass MyClass:\n    def __len__(self):\n        return 0\n\nprint(bool(MyClass()))\n\n# ---------- Functions can return a Boolean ----------\ndef my_function():\n    return True\n\nif my_function():\n    print(\"YES!\")\nelse:\n    print(\"NO!\")\n\n# Built-in functions that return Booleans, e.g. isinstance():\nx = 200\nprint(isinstance(x, int))\n", "11_Python_Booleans/README.md": "# 11. Python Booleans\n\nTopics in this folder (in order):\n\n1. Booleans - `01_booleans.py`\n", "12_Python_Operators/01_operators.py": "# ==========================================================\n# PYTHON OPERATORS\n# ==========================================================\n# Operators perform operations on variables and values.\nprint(10 + 5)\n\n# Python divides operators into these groups:\n#   Arithmetic operators   +  -  *  /  %  **  //\n#   Assignment operators   =  +=  -=  *= ...\n#   Comparison operators   ==  !=  >  <  >=  <=\n#   Logical operators      and  or  not\n#   Identity operators     is  is not\n#   Membership operators   in  not in\n#   Bitwise operators      &  |  ^  ~  <<  >>\n# Each group has its own file in this folder.\n\nsum1 = 100 + 50       # 150\nsum2 = sum1 + 250     # 400\nsum3 = sum2 + sum2    # 800\nprint(sum1, sum2, sum3)\n", "12_Python_Operators/02_arithmetic_operators.py": "# ==========================================================\n# ARITHMETIC OPERATORS\n# ==========================================================\nx = 15\ny = 4\n\nprint(x + y)    # Addition        19\nprint(x - y)    # Subtraction     11\nprint(x * y)    # Multiplication  60\nprint(x / y)    # Division        3.75\nprint(x % y)    # Modulus         3   (remainder)\nprint(x ** y)   # Exponentiation  50625\nprint(x // y)   # Floor division  3   (rounds down)\n\n# Division always returns a float:\nprint(12 / 3)   # 4.0\n\n# Floor division rounds DOWN, also for negatives:\nprint(-15 // 4) # -4\n", "12_Python_Operators/03_assignment_operators.py": "# ==========================================================\n# ASSIGNMENT OPERATORS\n# ==========================================================\nx = 5;   print(\"x = 5    ->\", x)\nx += 3;  print(\"x += 3   ->\", x)   # x = x + 3\nx -= 3;  print(\"x -= 3   ->\", x)   # x = x - 3\nx *= 3;  print(\"x *= 3   ->\", x)   # x = x * 3\nx /= 3;  print(\"x /= 3   ->\", x)   # x = x / 3\nx = 5\nx %= 3;  print(\"x %= 3   ->\", x)   # x = x % 3\nx = 5\nx //= 3; print(\"x //= 3  ->\", x)   # x = x // 3\nx = 5\nx **= 3; print(\"x **= 3  ->\", x)   # x = x ** 3\nx = 5\nx &= 3;  print(\"x &= 3   ->\", x)   # x = x & 3\nx = 5\nx |= 3;  print(\"x |= 3   ->\", x)   # x = x | 3\nx = 5\nx ^= 3;  print(\"x ^= 3   ->\", x)   # x = x ^ 3\nx = 5\nx >>= 3; print(\"x >>= 3  ->\", x)   # x = x >> 3\nx = 5\nx <<= 3; print(\"x <<= 3  ->\", x)   # x = x << 3\n\n# ---------- The Walrus operator :=  (Python 3.8+) ----------\n# Assigns a value AND returns it, inside an expression.\nnumbers = [1, 2, 3, 4, 5]\nif (count := len(numbers)) > 3:\n    print(f\"List has {count} elements\")\n", "12_Python_Operators/04_ternary_operator.py": "# ==========================================================\n# TERNARY OPERATOR (conditional expression)\n# ==========================================================\n# Write a simple if/else on ONE line:\n#     value_if_true if condition else value_if_false\n\na = 2\nb = 330\nprint(\"A\") if a > b else print(\"B\")\n\n# Most often used to assign a value:\nage = 20\nstatus = \"adult\" if age >= 18 else \"minor\"\nprint(status)\n\n# Several conditions can be chained (keep it readable!):\na = 330\nb = 330\nprint(\"A\") if a > b else print(\"=\") if a == b else print(\"B\")\n\n# Choosing the larger of two numbers:\nx, y = 15, 20\nbigger = x if x > y else y\nprint(\"Bigger:\", bigger)\n", "12_Python_Operators/05_comparison_operators.py": "# ==========================================================\n# COMPARISON OPERATORS\n# ==========================================================\n# Compare two values. The result is True or False.\nx = 5\ny = 3\n\nprint(x == y)   # Equal                  False\nprint(x != y)   # Not equal              True\nprint(x > y)    # Greater than           True\nprint(x < y)    # Less than              False\nprint(x >= y)   # Greater than or equal  True\nprint(x <= y)   # Less than or equal     False\n\n# ---------- Chaining comparisons ----------\n# 1 < x < 10  is the same as  1 < x and x < 10\nprint(1 < x < 10)    # True\nprint(1 < x > 10)    # False\n", "12_Python_Operators/06_logical_operators.py": "# ==========================================================\n# LOGICAL OPERATORS\n# ==========================================================\nx = 5\n\n# and -> True if BOTH statements are true\nprint(x > 3 and x < 10)          # True\n\n# or  -> True if ONE of the statements is true\nprint(x > 3 or x < 4)            # True\n\n# not -> reverses the result\nprint(not(x > 3 and x < 10))     # False\n\n# Example with variables:\nage = 25\nhas_ticket = True\nif age >= 18 and has_ticket:\n    print(\"You may enter\")\n", "12_Python_Operators/07_identity_operators.py": "# ==========================================================\n# IDENTITY OPERATORS\n# ==========================================================\n# Identity operators compare OBJECTS: are they the very same object\n# in memory? (Not just equal values.)\nx = [\"apple\", \"banana\"]\ny = [\"apple\", \"banana\"]\nz = x\n\nprint(x is z)      # True  - z is the same object as x\nprint(x is y)      # False - same content, but different objects\nprint(x == y)      # True  - == compares the VALUES\n\nprint(x is not z)  # False\nprint(x is not y)  # True\n\n# ---------- Difference between is and == ----------\n#   ==  checks if the values are equal\n#   is  checks if both refer to the same object\n# Use `is` mainly for None:\nvalue = None\nprint(value is None)\n", "12_Python_Operators/08_membership_operators.py": "# ==========================================================\n# MEMBERSHIP OPERATORS\n# ==========================================================\n# Test whether a sequence contains a value.\nfruits = [\"apple\", \"banana\", \"cherry\"]\n\nprint(\"banana\" in fruits)        # True\nprint(\"pineapple\" not in fruits) # True\n\n# Works with strings too:\ntext = \"Hello World\"\nprint(\"H\" in text)               # True\nprint(\"hello\" in text)           # False (case-sensitive)\nprint(\"z\" not in text)           # True\n\n# With dictionaries, `in` checks the KEYS:\nperson = {\"name\": \"Ravi\", \"age\": 36}\nprint(\"name\" in person)          # True\n", "12_Python_Operators/09_bitwise_operators.py": "# ==========================================================\n# BITWISE OPERATORS\n# ==========================================================\n# Work on numbers at the level of their binary bits.\na = 6     # 0110\nb = 3     # 0011\n\nprint(a & b)    # AND  -> 0010 = 2   (1 where both bits are 1)\nprint(a | b)    # OR   -> 0111 = 7   (1 where either bit is 1)\nprint(a ^ b)    # XOR  -> 0101 = 5   (1 where only one bit is 1)\nprint(~a)       # NOT  -> -7         (inverts all bits)\nprint(a << 1)   # Zero-fill left shift  -> 1100 = 12\nprint(a >> 1)   # Signed right shift    -> 0011 = 3\n\n# See the binary representation with bin():\nprint(bin(a), bin(b), bin(a & b))\n", "12_Python_Operators/10_operator_precedence.py": "# ==========================================================\n# OPERATOR PRECEDENCE\n# ==========================================================\n# Precedence describes the order in which operations are performed.\n\n# Parentheses have the highest precedence:\nprint((6 + 3) - (6 + 3))     # 0\n\n# Multiplication beats addition:\nprint(100 + 5 * 3)           # 115, not 315\n\n# Order, highest first:\n#   ()                         parentheses\n#   **                         exponentiation\n#   +x  -x  ~x                 unary plus, minus, bitwise NOT\n#   *  /  //  %                multiplication, division, floor div, modulus\n#   +  -                       addition, subtraction\n#   <<  >>                     bitwise shifts\n#   &                          bitwise AND\n#   ^                          bitwise XOR\n#   |                          bitwise OR\n#   == != > >= < <= is is not in not in   comparisons, identity, membership\n#   not                        logical NOT\n#   and                        AND\n#   or                         OR\n\n# Same precedence -> evaluated left to right:\nprint(5 + 4 - 7 + 3)         # 5\nprint(2 ** 3 ** 2)           # 512  (** is evaluated RIGHT to left)\n", "12_Python_Operators/README.md": "# 12. Python Operators\n\nTopics in this folder (in order):\n\n1. Operators - `01_operators.py`\n2. Arithmetic Operators - `02_arithmetic_operators.py`\n3. Assignment Operators - `03_assignment_operators.py`\n4. Ternary Operator - `04_ternary_operator.py`\n5. Comparison Operators - `05_comparison_operators.py`\n6. Logical Operators - `06_logical_operators.py`\n7. Identity Operators - `07_identity_operators.py`\n8. Membership Operators - `08_membership_operators.py`\n9. Bitwise Operators - `09_bitwise_operators.py`\n10. Operator Precedence - `10_operator_precedence.py`\n", "13_Python_Lists/01_lists.py": "# ==========================================================\n# PYTHON LISTS\n# ==========================================================\n# Lists store multiple items in a single variable, using square brackets.\nmylist = [\"apple\", \"banana\", \"cherry\"]\nprint(mylist)\n\n# ---------- List items ----------\n# Items are ORDERED, CHANGEABLE, and ALLOW DUPLICATES.\n# Items are indexed: the first item is [0], the second [1], ...\n\n# Ordered: items have a defined order that won't change (new items go at the end).\n# Changeable: we can change, add and remove items after creation.\n# Allow duplicates:\nthislist = [\"apple\", \"banana\", \"cherry\", \"apple\", \"cherry\"]\nprint(thislist)\n\n# ---------- List length ----------\nprint(len(thislist))\n\n# ---------- Data types ----------\nlist1 = [\"apple\", \"banana\", \"cherry\"]\nlist2 = [1, 5, 7, 9, 3]\nlist3 = [True, False, False]\nlist4 = [\"abc\", 34, True, 40, \"male\"]   # mixed types are fine\nprint(list1, list2, list3, list4)\n\n# ---------- type() ----------\nprint(type(mylist))          # <class 'list'>\n\n# ---------- The list() constructor ----------\nthislist = list((\"apple\", \"banana\", \"cherry\"))   # note the double brackets\nprint(thislist)\n\n# ---------- Python collections (arrays) ----------\n#   List       - ordered, changeable, duplicates allowed\n#   Tuple      - ordered, unchangeable, duplicates allowed\n#   Set        - unordered, items unchangeable (but add/remove ok), no duplicates\n#   Dictionary - ordered*, changeable, no duplicate keys\n#   (*ordered since Python 3.7)\n", "13_Python_Lists/02_access_list_items.py": "# ==========================================================\n# ACCESS LIST ITEMS\n# ==========================================================\nthislist = [\"apple\", \"banana\", \"cherry\", \"orange\", \"kiwi\", \"melon\", \"mango\"]\n\n# ---------- Access by index ----------\nprint(thislist[1])        # banana  (first item has index 0)\n\n# ---------- Negative indexing ----------\nprint(thislist[-1])       # mango   (-1 = last item)\n\n# ---------- Range of indexes ----------\nprint(thislist[2:5])      # items 2, 3, 4  (end not included)\nprint(thislist[:4])       # from the beginning to index 3\nprint(thislist[2:])       # from index 2 to the end\n\n# ---------- Range of negative indexes ----------\nprint(thislist[-4:-1])    # orange, kiwi, melon\n\n# ---------- Check if an item exists ----------\nif \"apple\" in thislist:\n    print(\"Yes, 'apple' is in the fruits list\")\n", "13_Python_Lists/03_change_list_items.py": "# ==========================================================\n# CHANGE LIST ITEMS\n# ==========================================================\n\n# ---------- Change one item ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthislist[1] = \"blackcurrant\"\nprint(thislist)\n\n# ---------- Change a range of items ----------\nthislist = [\"apple\", \"banana\", \"cherry\", \"orange\", \"kiwi\", \"mango\"]\nthislist[1:3] = [\"blackcurrant\", \"watermelon\"]\nprint(thislist)\n\n# Insert MORE items than you replace -> list grows\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthislist[1:2] = [\"blackcurrant\", \"watermelon\"]\nprint(thislist)\n\n# Insert FEWER items than you replace -> list shrinks\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthislist[1:3] = [\"watermelon\"]\nprint(thislist)\n\n# ---------- Insert items ----------\n# insert(index, item) adds an item without replacing anything\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthislist.insert(2, \"watermelon\")\nprint(thislist)\n", "13_Python_Lists/04_add_list_items.py": "# ==========================================================\n# ADD LIST ITEMS\n# ==========================================================\n\n# ---------- append() - add to the end ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthislist.append(\"orange\")\nprint(thislist)\n\n# ---------- insert() - add at a given index ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthislist.insert(1, \"orange\")\nprint(thislist)\n\n# ---------- extend() - add items from another list ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\ntropical = [\"mango\", \"pineapple\", \"papaya\"]\nthislist.extend(tropical)\nprint(thislist)\n\n# ---------- extend() with any iterable (tuple, set, dict...) ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthistuple = (\"kiwi\", \"orange\")\nthislist.extend(thistuple)\nprint(thislist)\n", "13_Python_Lists/05_remove_list_items.py": "# ==========================================================\n# REMOVE LIST ITEMS\n# ==========================================================\n\n# ---------- remove() - remove a specified item ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthislist.remove(\"banana\")\nprint(thislist)\n\n# If there are duplicates, remove() only removes the FIRST one:\nthislist = [\"apple\", \"banana\", \"cherry\", \"banana\", \"kiwi\"]\nthislist.remove(\"banana\")\nprint(thislist)\n\n# ---------- pop() - remove by index ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthislist.pop(1)\nprint(thislist)\n\n# Without an index, pop() removes the LAST item\nthislist = [\"apple\", \"banana\", \"cherry\"]\nremoved = thislist.pop()\nprint(thislist, \"- removed:\", removed)\n\n# ---------- del keyword ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\ndel thislist[0]\nprint(thislist)\n\n# del can delete the whole list:\nthislist = [\"apple\", \"banana\", \"cherry\"]\ndel thislist\n# print(thislist)   # NameError - the list no longer exists\n\n# ---------- clear() - empty the list ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\nthislist.clear()\nprint(thislist)     # []\n", "13_Python_Lists/06_loop_lists.py": "# ==========================================================\n# LOOP LISTS\n# ==========================================================\nthislist = [\"apple\", \"banana\", \"cherry\"]\n\n# ---------- for loop ----------\nfor x in thislist:\n    print(x)\n\n# ---------- Loop through the index numbers ----------\n# range(len(...)) gives 0, 1, 2 ...\nfor i in range(len(thislist)):\n    print(i, thislist[i])\n\n# ---------- while loop ----------\ni = 0\nwhile i < len(thislist):\n    print(thislist[i])\n    i = i + 1\n\n# ---------- Looping with list comprehension ----------\n# A short way to loop (more in the next lesson):\n[print(x) for x in thislist]\n\n# ---------- enumerate() - index and value together ----------\nfor index, fruit in enumerate(thislist):\n    print(index, fruit)\n", "13_Python_Lists/07_list_comprehension.py": "# ==========================================================\n# LIST COMPREHENSION\n# ==========================================================\n# A shorter syntax to create a new list based on an existing one.\n\nfruits = [\"apple\", \"banana\", \"cherry\", \"kiwi\", \"mango\"]\n\n# Without list comprehension:\nnewlist = []\nfor x in fruits:\n    if \"a\" in x:\n        newlist.append(x)\nprint(newlist)\n\n# With list comprehension - one line:\nnewlist = [x for x in fruits if \"a\" in x]\nprint(newlist)\n\n# ---------- The syntax ----------\n#   newlist = [expression for item in iterable if condition == True]\n# The original list is left unchanged.\n\n# ---------- Condition ----------\nnewlist = [x for x in fruits if x != \"apple\"]\nprint(newlist)\nnewlist = [x for x in fruits]          # no condition -> copy\nprint(newlist)\n\n# ---------- Iterable ----------\nnewlist = [x for x in range(10)]\nprint(newlist)\nnewlist = [x for x in range(10) if x < 5]\nprint(newlist)\n\n# ---------- Expression ----------\nnewlist = [x.upper() for x in fruits]\nprint(newlist)\nnewlist = [\"hello\" for x in fruits]\nprint(newlist)\n\n# The expression can contain a condition (like a filter that changes values):\nnewlist = [x if x != \"banana\" else \"orange\" for x in fruits]\nprint(newlist)\n", "13_Python_Lists/08_sort_lists.py": "# ==========================================================\n# SORT LISTS\n# ==========================================================\n\n# ---------- Sort alphanumerically (ascending) ----------\nthislist = [\"orange\", \"mango\", \"kiwi\", \"pineapple\", \"banana\"]\nthislist.sort()\nprint(thislist)\n\nthislist = [100, 50, 65, 82, 23]\nthislist.sort()\nprint(thislist)\n\n# ---------- Sort descending ----------\nthislist = [\"orange\", \"mango\", \"kiwi\", \"pineapple\", \"banana\"]\nthislist.sort(reverse=True)\nprint(thislist)\n\n# ---------- Customize sort with key= ----------\n# Sort by how close each number is to 50:\ndef myfunc(n):\n    return abs(n - 50)\n\nthislist = [100, 50, 65, 82, 23]\nthislist.sort(key=myfunc)\nprint(thislist)\n\n# ---------- Case-insensitive sort ----------\n# By default capital letters come before lower case letters:\nthislist = [\"banana\", \"Orange\", \"Kiwi\", \"cherry\"]\nthislist.sort()\nprint(thislist)\n\nthislist.sort(key=str.lower)\nprint(thislist)\n\n# ---------- Reverse order ----------\nthislist = [\"banana\", \"Orange\", \"Kiwi\", \"cherry\"]\nthislist.reverse()\nprint(thislist)\n\n# sorted() returns a NEW sorted list and leaves the original unchanged\nnums = [3, 1, 2]\nprint(sorted(nums), nums)\n", "13_Python_Lists/09_copy_lists.py": "# ==========================================================\n# COPY LISTS\n# ==========================================================\n# You cannot copy a list with list2 = list1:\n# list2 is only a REFERENCE, changes to list1 also show up in list2.\nlist1 = [\"apple\", \"banana\"]\nlist2 = list1\nlist1.append(\"cherry\")\nprint(list2)          # ['apple', 'banana', 'cherry']\n\n# ---------- copy() method ----------\nthislist = [\"apple\", \"banana\", \"cherry\"]\nmylist = thislist.copy()\nprint(mylist)\n\n# ---------- list() constructor ----------\nmylist = list(thislist)\nprint(mylist)\n\n# ---------- Slice operator ----------\nmylist = thislist[:]\nprint(mylist)\n\n# Now changes do not affect the copy:\nthislist.append(\"kiwi\")\nprint(thislist, mylist)\n", "13_Python_Lists/10_join_lists.py": "# ==========================================================\n# JOIN LISTS\n# ==========================================================\nlist1 = [\"a\", \"b\", \"c\"]\nlist2 = [1, 2, 3]\n\n# ---------- + operator ----------\nlist3 = list1 + list2\nprint(list3)\n\n# ---------- append items one by one ----------\nlist1 = [\"a\", \"b\", \"c\"]\nfor x in list2:\n    list1.append(x)\nprint(list1)\n\n# ---------- extend() ----------\nlist1 = [\"a\", \"b\", \"c\"]\nlist1.extend(list2)\nprint(list1)\n", "13_Python_Lists/11_list_methods.py": "# ==========================================================\n# LIST METHODS\n# ==========================================================\nfruits = [\"apple\", \"banana\", \"cherry\"]\n\nfruits.append(\"orange\")          # append()  add an element at the end\nprint(fruits)\n\ncopy = fruits.copy()             # copy()    return a copy\nprint(copy)\n\nprint(fruits.count(\"apple\"))     # count()   number of times a value appears\n\nfruits.extend([\"kiwi\", \"fig\"])   # extend()  add elements of an iterable\nprint(fruits)\n\nprint(fruits.index(\"cherry\"))    # index()   index of the first match\n\nfruits.insert(1, \"lemon\")        # insert()  add at a position\nprint(fruits)\n\nfruits.pop(1)                    # pop()     remove at a position\nprint(fruits)\n\nfruits.remove(\"fig\")             # remove()  remove the first matching item\nprint(fruits)\n\nfruits.reverse()                 # reverse() reverse the order\nprint(fruits)\n\nfruits.sort()                    # sort()    sort the list\nprint(fruits)\n\nfruits.clear()                   # clear()   remove all elements\nprint(fruits)\n", "13_Python_Lists/README.md": "# 13. Python Lists\n\nTopics in this folder (in order):\n\n1. Lists - `01_lists.py`\n2. Access List Items - `02_access_list_items.py`\n3. Change List Items - `03_change_list_items.py`\n4. __add__ List Items - `04_add_list_items.py`\n5. Remove List Items - `05_remove_list_items.py`\n6. Loop Lists - `06_loop_lists.py`\n7. List Comprehension - `07_list_comprehension.py`\n8. Sort Lists - `08_sort_lists.py`\n9. Copy Lists - `09_copy_lists.py`\n10. Join Lists - `10_join_lists.py`\n11. List Methods - `11_list_methods.py`\n", "14_Python_Tuples/01_tuples.py": "# ==========================================================\n# PYTHON TUPLES\n# ==========================================================\n# A tuple stores multiple items in one variable, using round brackets.\n# Tuples are ORDERED and UNCHANGEABLE and ALLOW DUPLICATES.\nthistuple = (\"apple\", \"banana\", \"cherry\")\nprint(thistuple)\n\n# Duplicates allowed:\nthistuple = (\"apple\", \"banana\", \"cherry\", \"apple\", \"cherry\")\nprint(thistuple)\n\n# ---------- Tuple length ----------\nprint(len(thistuple))\n\n# ---------- Tuple with ONE item ----------\n# You need a trailing comma, otherwise it is not a tuple:\nthistuple = (\"apple\",)\nprint(type(thistuple))   # tuple\nthistuple = (\"apple\")\nprint(type(thistuple))   # str!\n\n# ---------- Data types ----------\ntuple1 = (\"apple\", \"banana\", \"cherry\")\ntuple2 = (1, 5, 7, 9, 3)\ntuple3 = (True, False, False)\ntuple4 = (\"abc\", 34, True, 40, \"male\")\nprint(tuple1, tuple2, tuple3, tuple4)\n\n# ---------- type() ----------\nprint(type(tuple1))\n\n# ---------- tuple() constructor ----------\nthistuple = tuple((\"apple\", \"banana\", \"cherry\"))   # double round brackets\nprint(thistuple)\n", "14_Python_Tuples/02_access_tuples.py": "# ==========================================================\n# ACCESS TUPLE ITEMS\n# ==========================================================\nthistuple = (\"apple\", \"banana\", \"cherry\", \"orange\", \"kiwi\", \"melon\", \"mango\")\n\nprint(thistuple[1])       # by index\nprint(thistuple[-1])      # negative index\nprint(thistuple[2:5])     # range of indexes\nprint(thistuple[:4])      # from the start\nprint(thistuple[2:])      # to the end\nprint(thistuple[-4:-1])   # negative range\n\n# Check if an item exists\nif \"apple\" in thistuple:\n    print(\"Yes, 'apple' is in the fruits tuple\")\n", "14_Python_Tuples/03_update_tuples.py": "# ==========================================================\n# UPDATE TUPLES\n# ==========================================================\n# Tuples are unchangeable (immutable), but there are workarounds.\n\n# ---------- Change values: convert to list and back ----------\nx = (\"apple\", \"banana\", \"cherry\")\ny = list(x)\ny[1] = \"kiwi\"\nx = tuple(y)\nprint(x)\n\n# ---------- Add items ----------\n# 1) Convert to a list:\nthistuple = (\"apple\", \"banana\", \"cherry\")\ny = list(thistuple)\ny.append(\"orange\")\nthistuple = tuple(y)\nprint(thistuple)\n\n# 2) Add a tuple to a tuple:\nthistuple = (\"apple\", \"banana\", \"cherry\")\ny = (\"orange\",)\nthistuple += y\nprint(thistuple)\n\n# ---------- Remove items ----------\nthistuple = (\"apple\", \"banana\", \"cherry\")\ny = list(thistuple)\ny.remove(\"apple\")\nthistuple = tuple(y)\nprint(thistuple)\n\n# del removes the whole tuple:\nthistuple = (\"apple\", \"banana\", \"cherry\")\ndel thistuple\n# print(thistuple)   # NameError\n", "14_Python_Tuples/04_unpack_tuples.py": "# ==========================================================\n# UNPACK TUPLES\n# ==========================================================\n# Creating a tuple = \"packing\" values into it:\nfruits = (\"apple\", \"banana\", \"cherry\")\n\n# Extracting the values into variables = \"unpacking\":\n(green, yellow, red) = fruits\nprint(green)\nprint(yellow)\nprint(red)\n\n# ---------- Using an asterisk * ----------\n# If there are fewer variables than values, * collects the rest into a list:\nfruits = (\"apple\", \"banana\", \"cherry\", \"strawberry\", \"raspberry\")\n(green, yellow, *red) = fruits\nprint(green, yellow, red)\n\n# The * can be on any variable:\nfruits = (\"apple\", \"mango\", \"papaya\", \"pineapple\", \"cherry\")\n(green, *tropic, red) = fruits\nprint(green, tropic, red)\n", "14_Python_Tuples/05_loop_tuples.py": "# ==========================================================\n# LOOP TUPLES\n# ==========================================================\nthistuple = (\"apple\", \"banana\", \"cherry\")\n\n# for loop\nfor x in thistuple:\n    print(x)\n\n# loop through the index numbers\nfor i in range(len(thistuple)):\n    print(thistuple[i])\n\n# while loop\ni = 0\nwhile i < len(thistuple):\n    print(thistuple[i])\n    i = i + 1\n", "14_Python_Tuples/06_join_tuples.py": "# ==========================================================\n# JOIN TUPLES\n# ==========================================================\n# Join two tuples with +\ntuple1 = (\"a\", \"b\", \"c\")\ntuple2 = (1, 2, 3)\ntuple3 = tuple1 + tuple2\nprint(tuple3)\n\n# Multiply a tuple with *\nfruits = (\"apple\", \"banana\", \"cherry\")\nmytuple = fruits * 2\nprint(mytuple)\n", "14_Python_Tuples/07_tuple_methods.py": "# ==========================================================\n# TUPLE METHODS\n# ==========================================================\n# Tuples have two built-in methods:\nthistuple = (1, 3, 7, 8, 7, 5, 4, 6, 8, 5)\n\n# count() - how many times a value occurs\nprint(thistuple.count(5))      # 2\n\n# index() - position of the first occurrence\nprint(thistuple.index(8))      # 3\n", "14_Python_Tuples/README.md": "# 14. Python Tuples\n\nTopics in this folder (in order):\n\n1. Tuples - `01_tuples.py`\n2. Access Tuples - `02_access_tuples.py`\n3. Update Tuples - `03_update_tuples.py`\n4. Unpack Tuples - `04_unpack_tuples.py`\n5. Loop Tuples - `05_loop_tuples.py`\n6. Join Tuples - `06_join_tuples.py`\n7. Tuple Methods - `07_tuple_methods.py`\n", "15_Python_Sets/01_sets.py": "# ==========================================================\n# PYTHON SETS\n# ==========================================================\n# A set stores multiple items using curly brackets.\n# Sets are UNORDERED, items are UNCHANGEABLE*, and UNINDEXED.\n# (*you can't change an item, but you can remove items and add new ones)\nthisset = {\"apple\", \"banana\", \"cherry\"}\nprint(thisset)        # the order may be different each time!\n\n# ---------- Duplicates not allowed ----------\nthisset = {\"apple\", \"banana\", \"cherry\", \"apple\"}\nprint(thisset)\n\n# True and 1 are considered the same value (also False and 0):\nthisset = {\"apple\", \"banana\", \"cherry\", True, 1, 2}\nprint(thisset)\n\n# ---------- Length ----------\nprint(len(thisset))\n\n# ---------- Data types ----------\nset1 = {\"apple\", \"banana\", \"cherry\"}\nset2 = {1, 5, 7, 9, 3}\nset3 = {True, False}\nset4 = {\"abc\", 34, True, 40, \"male\"}\nprint(set1, set2, set3, set4)\nprint(type(set1))\n\n# ---------- set() constructor ----------\nthisset = set((\"apple\", \"banana\", \"cherry\"))   # double round brackets\nprint(thisset)\n\n# Note: {} creates an empty DICTIONARY - use set() for an empty set\nempty = set()\nprint(type(empty))\n", "15_Python_Sets/02_access_set_items.py": "# ==========================================================\n# ACCESS SET ITEMS\n# ==========================================================\n# Set items have no index, so you cannot use thisset[0].\n# Instead, loop through the set or check with `in`.\nthisset = {\"apple\", \"banana\", \"cherry\"}\n\nfor x in thisset:\n    print(x)\n\nprint(\"banana\" in thisset)       # True\nprint(\"banana\" not in thisset)   # False\n\n# Once a set is created you cannot CHANGE its items,\n# but you can add new items (next lesson).\n", "15_Python_Sets/03_add_set_items.py": "# ==========================================================\n# ADD SET ITEMS\n# ==========================================================\n\n# ---------- add() - one item ----------\nthisset = {\"apple\", \"banana\", \"cherry\"}\nthisset.add(\"orange\")\nprint(thisset)\n\n# ---------- update() - items from another set ----------\nthisset = {\"apple\", \"banana\", \"cherry\"}\ntropical = {\"pineapple\", \"mango\", \"papaya\"}\nthisset.update(tropical)\nprint(thisset)\n\n# ---------- update() works with any iterable ----------\nthisset = {\"apple\", \"banana\", \"cherry\"}\nmylist = [\"kiwi\", \"orange\"]\nthisset.update(mylist)\nprint(thisset)\n", "15_Python_Sets/04_remove_set_items.py": "# ==========================================================\n# REMOVE SET ITEMS\n# ==========================================================\n\n# ---------- remove() ----------\nthisset = {\"apple\", \"banana\", \"cherry\"}\nthisset.remove(\"banana\")\nprint(thisset)\n# remove() raises an error if the item does not exist.\n\n# ---------- discard() ----------\nthisset = {\"apple\", \"banana\", \"cherry\"}\nthisset.discard(\"banana\")\nthisset.discard(\"not-there\")     # no error\nprint(thisset)\n\n# ---------- pop() ----------\n# Removes a RANDOM item (sets are unordered) and returns it.\nthisset = {\"apple\", \"banana\", \"cherry\"}\nx = thisset.pop()\nprint(\"removed:\", x)\nprint(thisset)\n\n# ---------- clear() ----------\nthisset = {\"apple\", \"banana\", \"cherry\"}\nthisset.clear()\nprint(thisset)       # set()\n\n# ---------- del ----------\nthisset = {\"apple\", \"banana\", \"cherry\"}\ndel thisset\n# print(thisset)     # NameError\n", "15_Python_Sets/05_loop_sets.py": "# ==========================================================\n# LOOP SETS\n# ==========================================================\nthisset = {\"apple\", \"banana\", \"cherry\"}\n\nfor x in thisset:\n    print(x)\n", "15_Python_Sets/06_join_sets.py": "# ==========================================================\n# JOIN SETS\n# ==========================================================\nset1 = {\"a\", \"b\", \"c\"}\nset2 = {1, 2, 3}\n\n# ---------- union() / | - all items from both ----------\nset3 = set1.union(set2)\nprint(set3)\nprint(set1 | set2)\n\n# Join many sets:\nset4 = {\"John\", \"Elena\"}\nprint(set1.union(set2, set4))\nprint(set1 | set2 | set4)\n\n# union() also accepts lists/tuples (the | operator does not):\nprint({\"a\", \"b\"}.union([1, 2], (3,)))\n\n# ---------- update() - add items into the existing set ----------\nset1 = {\"a\", \"b\", \"c\"}\nset1.update(set2)\nprint(set1)\n# union() and update() both drop duplicates.\n\n# ---------- intersection() / & - only items in BOTH ----------\nset1 = {\"apple\", \"banana\", \"cherry\"}\nset2 = {\"google\", \"microsoft\", \"apple\"}\nprint(set1.intersection(set2))\nprint(set1 & set2)\nset1.intersection_update(set2)   # keep only the duplicates in set1\nprint(set1)\n\n# ---------- difference() / - - items in the first set only ----------\nset1 = {\"apple\", \"banana\", \"cherry\"}\nprint(set1.difference(set2))\nprint(set1 - set2)\nset1.difference_update(set2)\nprint(set1)\n\n# ---------- symmetric_difference() / ^ - items NOT in both ----------\nset1 = {\"apple\", \"banana\", \"cherry\"}\nprint(set1.symmetric_difference(set2))\nprint(set1 ^ set2)\nset1.symmetric_difference_update(set2)\nprint(set1)\n", "15_Python_Sets/07_frozenset.py": "# ==========================================================\n# FROZENSET\n# ==========================================================\n# A frozenset is an IMMUTABLE version of a set.\n# Its items cannot be added or removed after creation.\n# Because it is immutable, it can be used as a dictionary key\n# or as an element inside another set.\n\nx = frozenset({\"apple\", \"banana\", \"cherry\"})\nprint(x)\nprint(type(x))\n\n# x.add(\"orange\")   # AttributeError - frozensets cannot change\n\n# ---------- Frozenset methods (they all return new objects) ----------\na = frozenset({1, 2, 3})\nb = frozenset({3, 4})\nprint(a.copy())                  # copy()\nprint(a.difference(b))           # difference()        a - b\nprint(a.intersection(b))         # intersection()      a & b\nprint(a.isdisjoint(b))           # isdisjoint()\nprint(frozenset({1}).issubset(a))   # issubset()       <=\nprint(a.issuperset({1, 2}))      # issuperset()        >=\nprint(a.symmetric_difference(b)) # symmetric_difference()  a ^ b\nprint(a.union(b))                # union()             a | b\n\n# As a dictionary key:\ndistances = {frozenset({\"Delhi\", \"Agra\"}): 233}\nprint(distances[frozenset({\"Agra\", \"Delhi\"})])\n", "15_Python_Sets/08_set_methods.py": "# ==========================================================\n# SET METHODS\n# ==========================================================\ns = {\"apple\", \"banana\"}\n\ns.add(\"cherry\")                        # add()\nprint(s)\nc = s.copy()                           # copy()\nprint(c)\nprint({1, 2, 3}.difference({2}))       # difference()            -\nx = {1, 2, 3}; x.difference_update({2}); print(x)   # difference_update()  -=\ns.discard(\"banana\")                    # discard()\nprint(s)\nprint({1, 2}.intersection({2, 3}))     # intersection()          &\nx = {1, 2}; x.intersection_update({2, 3}); print(x) # intersection_update() &=\nprint({1, 2}.isdisjoint({3}))          # isdisjoint()\nprint({1}.issubset({1, 2}))            # issubset()              <=\nprint({1, 2} < {1, 2, 3})              # proper subset           <\nprint({1, 2}.issuperset({1}))          # issuperset()            >=\nprint({1, 2, 3} > {1})                 # proper superset         >\nx = {1, 2}; x.pop(); print(x)          # pop()     remove a random item\nx = {1, 2}; x.remove(1); print(x)      # remove()\nprint({1, 2}.symmetric_difference({2, 3}))   # symmetric_difference()  ^\nx = {1, 2}; x.symmetric_difference_update({2, 3}); print(x)  # ^=\nprint({1}.union({2}))                  # union()                 |\nx = {1}; x.update([2, 3]); print(x)    # update()                |=\ns.clear()                              # clear()\nprint(s)\n", "15_Python_Sets/README.md": "# 15. Python Sets\n\nTopics in this folder (in order):\n\n1. Sets - `01_sets.py`\n2. Access Set Items - `02_access_set_items.py`\n3. __add__ Set Items - `03_add_set_items.py`\n4. Remove Set Items - `04_remove_set_items.py`\n5. Loop Sets - `05_loop_sets.py`\n6. Join Sets - `06_join_sets.py`\n7. Frozenset - `07_frozenset.py`\n8. Set Methods - `08_set_methods.py`\n", "16_Python_Dictionaries/01_dictionaries.py": "# ==========================================================\n# PYTHON DICTIONARIES\n# ==========================================================\n# Dictionaries store data values in key:value pairs.\n# They are ORDERED (Python 3.7+), CHANGEABLE, and do NOT allow duplicate keys.\nthisdict = {\n    \"brand\": \"Ford\",\n    \"model\": \"Mustang\",\n    \"year\": 1964\n}\nprint(thisdict)\n\n# ---------- Dictionary items ----------\nprint(thisdict[\"brand\"])\n\n# ---------- Duplicates not allowed ----------\n# A repeated key overwrites the earlier value:\nthisdict = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964, \"year\": 2020}\nprint(thisdict)\n\n# ---------- Length ----------\nprint(len(thisdict))\n\n# ---------- Values can be of any type ----------\nthisdict = {\n    \"brand\": \"Ford\",\n    \"electric\": False,\n    \"year\": 1964,\n    \"colors\": [\"red\", \"white\", \"blue\"]\n}\nprint(thisdict)\nprint(type(thisdict))\n\n# ---------- dict() constructor ----------\nthisdict = dict(name=\"Ravi\", age=36, country=\"India\")\nprint(thisdict)\n", "16_Python_Dictionaries/02_access_items.py": "# ==========================================================\n# ACCESS DICTIONARY ITEMS\n# ==========================================================\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\n\n# ---------- By key ----------\nprint(car[\"model\"])\nprint(car.get(\"model\"))          # get() - returns None instead of an error\nprint(car.get(\"color\"))          # None\nprint(car.get(\"color\", \"n/a\"))   # default value\n\n# ---------- Get keys ----------\nx = car.keys()\nprint(x)\n# The keys view is LIVE - it updates when the dictionary changes:\ncar[\"color\"] = \"white\"\nprint(x)\n\n# ---------- Get values ----------\ny = car.values()\nprint(y)\ncar[\"year\"] = 2020\nprint(y)                         # also live\n\n# ---------- Get items (key, value) pairs ----------\nz = car.items()\nprint(z)\n\n# ---------- Check if a key exists ----------\nif \"model\" in car:\n    print(\"Yes, 'model' is one of the keys\")\n", "16_Python_Dictionaries/03_change_items.py": "# ==========================================================\n# CHANGE DICTIONARY ITEMS\n# ==========================================================\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\n\n# ---------- Change a value by its key ----------\ncar[\"year\"] = 2018\nprint(car)\n\n# ---------- update() ----------\n# Updates the dictionary with items from another dict / iterable of pairs\ncar.update({\"year\": 20
