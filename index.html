20})\nprint(car)\n", "16_Python_Dictionaries/04_add_items.py": "# ==========================================================\n# ADD DICTIONARY ITEMS\n# ==========================================================\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\n\n# ---------- Use a new key ----------\ncar[\"color\"] = \"red\"\nprint(car)\n\n# ---------- update() ----------\n# If the key does not exist it is added:\ncar.update({\"owner\": \"Ravi\"})\nprint(car)\n", "16_Python_Dictionaries/05_remove_items.py": "# ==========================================================\n# REMOVE DICTIONARY ITEMS\n# ==========================================================\n\n# ---------- pop() - remove by key ----------\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\ncar.pop(\"model\")\nprint(car)\n\n# ---------- popitem() - remove the LAST inserted item ----------\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\ncar.popitem()\nprint(car)\n\n# ---------- del - remove by key ----------\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\ndel car[\"model\"]\nprint(car)\n\n# del can delete the whole dictionary:\ndel car\n# print(car)   # NameError\n\n# ---------- clear() - empty the dictionary ----------\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\ncar.clear()\nprint(car)     # {}\n", "16_Python_Dictionaries/06_loop_dictionaries.py": "# ==========================================================\n# LOOP DICTIONARIES\n# ==========================================================\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\n\n# Keys (the default)\nfor x in car:\n    print(x)\n\n# Values by key\nfor x in car:\n    print(car[x])\n\n# values()\nfor x in car.values():\n    print(x)\n\n# keys()\nfor x in car.keys():\n    print(x)\n\n# Both keys and values with items()\nfor key, value in car.items():\n    print(key, \"->\", value)\n", "16_Python_Dictionaries/07_copy_dictionaries.py": "# ==========================================================\n# COPY DICTIONARIES\n# ==========================================================\n# dict2 = dict1 only creates a REFERENCE - both names point to the same dict.\ndict1 = {\"a\": 1}\ndict2 = dict1\ndict1[\"b\"] = 2\nprint(dict2)          # {'a': 1, 'b': 2}\n\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\n\n# ---------- copy() ----------\nmydict = car.copy()\nprint(mydict)\n\n# ---------- dict() ----------\nmydict = dict(car)\nprint(mydict)\n\ncar[\"year\"] = 2025\nprint(car[\"year\"], mydict[\"year\"])   # the copy is unchanged\n", "16_Python_Dictionaries/08_nested_dictionaries.py": "# ==========================================================\n# NESTED DICTIONARIES\n# ==========================================================\n# A dictionary can contain other dictionaries.\nmyfamily = {\n    \"child1\": {\"name\": \"Emil\", \"year\": 2004},\n    \"child2\": {\"name\": \"Tobias\", \"year\": 2007},\n    \"child3\": {\"name\": \"Linus\", \"year\": 2011},\n}\nprint(myfamily)\n\n# Or build it from separate dictionaries:\nchild1 = {\"name\": \"Emil\", \"year\": 2004}\nchild2 = {\"name\": \"Tobias\", \"year\": 2007}\nchild3 = {\"name\": \"Linus\", \"year\": 2011}\nmyfamily = {\"child1\": child1, \"child2\": child2, \"child3\": child3}\n\n# ---------- Access items in nested dictionaries ----------\nprint(myfamily[\"child2\"][\"name\"])\n\n# ---------- Loop through nested dictionaries ----------\nfor key, child in myfamily.items():\n    print(key)\n    for field in child:\n        print(\"   \", field + \":\", child[field])\n", "16_Python_Dictionaries/09_dictionary_methods.py": "# ==========================================================\n# DICTIONARY METHODS\n# ==========================================================\ncar = {\"brand\": \"Ford\", \"model\": \"Mustang\", \"year\": 1964}\n\nprint(car.copy())                         # copy()\nprint(dict.fromkeys([\"a\", \"b\"], 0))       # fromkeys() - dict from keys + value\nprint(car.get(\"model\"))                   # get()\nprint(car.items())                        # items()\nprint(car.keys())                         # keys()\nprint(car.values())                       # values()\nprint(car.setdefault(\"color\", \"red\"))     # setdefault() - get, or insert if missing\nprint(car)\ncar.update({\"year\": 2020})                # update()\nprint(car)\nprint(car.pop(\"color\"))                   # pop()     - remove by key\nprint(car.popitem())                      # popitem() - remove last inserted\ncar.clear()                               # clear()\nprint(car)\n", "16_Python_Dictionaries/README.md": "# 16. Python Dictionaries\n\nTopics in this folder (in order):\n\n1. Dictionaries - `01_dictionaries.py`\n2. Access Items - `02_access_items.py`\n3. Change Items - `03_change_items.py`\n4. __add__ Items - `04_add_items.py`\n5. Remove Items - `05_remove_items.py`\n6. Loop Dictionaries - `06_loop_dictionaries.py`\n7. Copy Dictionaries - `07_copy_dictionaries.py`\n8. Nested Dictionaries - `08_nested_dictionaries.py`\n9. Dictionary Methods - `09_dictionary_methods.py`\n", "17_Python_If_Else/01_if.py": "# ==========================================================\n# PYTHON IF\n# ==========================================================\n# Conditions use the comparison operators:\n#   a == b   a != b   a < b   a <= b   a > b   a >= b\n# They are most often used in if statements and loops.\n\na = 33\nb = 200\nif b > a:\n    print(\"b is greater than a\")\n\n# ---------- Indentation ----------\n# Python uses indentation to define the body of the if statement.\n# if b > a:\n# print(\"b is greater than a\")   # IndentationError\n\n# ---------- Several statements in the block ----------\nage = 20\nif age >= 18:\n    print(\"You are an adult\")\n    print(\"You can vote\")\n\n# ---------- Boolean variables in if ----------\nis_logged_in = True\nif is_logged_in:\n    print(\"Welcome back!\")\n", "17_Python_If_Else/02_elif.py": "# ==========================================================\n# PYTHON ELIF\n# ==========================================================\n# elif = \"if the previous conditions were not true, try this one\"\na = 33\nb = 33\nif b > a:\n    print(\"b is greater than a\")\nelif a == b:\n    print(\"a and b are equal\")\n\n# You can have as many elif blocks as you need:\nscore = 75\nif score >= 90:\n    print(\"Grade: A\")\nelif score >= 80:\n    print(\"Grade: B\")\nelif score >= 70:\n    print(\"Grade: C\")\nelif score >= 60:\n    print(\"Grade: D\")\n# Python stops at the FIRST true condition.\n", "17_Python_If_Else/03_else.py": "# ==========================================================\n# PYTHON ELSE\n# ==========================================================\n# else catches anything not caught by the previous conditions.\na = 200\nb = 33\nif b > a:\n    print(\"b is greater than a\")\nelif a == b:\n    print(\"a and b are equal\")\nelse:\n    print(\"a is greater than b\")\n\n# else without elif:\nif b > a:\n    print(\"b is greater than a\")\nelse:\n    print(\"b is not greater than a\")\n\n# Even / odd check:\nnumber = 7\nif number % 2 == 0:\n    print(number, \"is even\")\nelse:\n    print(number, \"is odd\")\n", "17_Python_If_Else/04_shorthand_if.py": "# ==========================================================\n# SHORTHAND IF\n# ==========================================================\na = 200\nb = 33\n\n# ---------- Short hand if: one statement on the same line ----------\nif a > b: print(\"a is greater than b\")\n\n# ---------- Short hand if ... else (ternary / conditional expression) ----------\nprint(\"A\") if a > b else print(\"B\")\n\n# Assign a value with it:\nbigger = a if a > b else b\nprint(\"Bigger:\", bigger)\n\n# ---------- Several conditions on one line ----------\na = 330\nb = 330\nprint(\"A\") if a > b else print(\"=\") if a == b else print(\"B\")\n", "17_Python_If_Else/05_logical_operators.py": "# ==========================================================\n# IF WITH LOGICAL OPERATORS\n# ==========================================================\na = 200\nb = 33\nc = 500\n\n# and - both conditions must be true\nif a > b and c > a:\n    print(\"Both conditions are True\")\n\n# or - at least one condition must be true\nif a > b or a > c:\n    print(\"At least one of the conditions is True\")\n\n# not - reverses the result\nif not a > b:\n    print(\"a is NOT greater than b\")\nelse:\n    print(\"a is greater than b\")\n\n# Combining them (use parentheses for clarity):\nage = 25\nis_student = False\nhas_coupon = True\nif age < 26 and (is_student or has_coupon):\n    print(\"You get a discount\")\n", "17_Python_If_Else/06_nested_if.py": "# ==========================================================\n# NESTED IF\n# ==========================================================\n# An if statement inside another if statement.\nx = 41\n\nif x > 10:\n    print(\"Above ten,\")\n    if x > 20:\n        print(\"and also above 20!\")\n    else:\n        print(\"but not above 20.\")\n\n# Practical example:\nusername = \"admin\"\npassword = \"1234\"\nif username == \"admin\":\n    if password == \"1234\":\n        print(\"Login successful\")\n    else:\n        print(\"Wrong password\")\nelse:\n    print(\"Unknown user\")\n", "17_Python_If_Else/07_pass_statement.py": "# ==========================================================\n# THE PASS STATEMENT\n# ==========================================================\n# An if block cannot be empty. If you need an empty block\n# (for example, as a placeholder), use `pass` to avoid an error.\na = 33\nb = 200\n\nif b > a:\n    pass        # TODO: fill this in later\n\n# pass also works in loops, functions and classes:\nfor i in range(3):\n    pass\n\ndef future_function():\n    pass\n\nclass FutureClass:\n    pass\n\nprint(\"pass lets the program run without errors\")\n", "17_Python_If_Else/README.md": "# 17. Python If...Else\n\nTopics in this folder (in order):\n\n1. If - `01_if.py`\n2. Elif - `02_elif.py`\n3. Else - `03_else.py`\n4. Shorthand If - `04_shorthand_if.py`\n5. Logical Operators - `05_logical_operators.py`\n6. Nested If - `06_nested_if.py`\n7. Pass Statement - `07_pass_statement.py`\n", "18_Python_Match/01_match.py": "# ==========================================================\n# PYTHON MATCH  (Python 3.10+)\n# ==========================================================\n# Instead of writing many if..elif statements, use match.\n# match picks ONE block of code to run, based on a value.\n#\n#   match expression:\n#     case x:\n#       code block\n#     case y:\n#       code block\n#     case _:\n#       default block\n\nday = 4\nmatch day:\n    case 1:\n        print(\"Monday\")\n    case 2:\n        print(\"Tuesday\")\n    case 3:\n        print(\"Wednesday\")\n    case 4:\n        print(\"Thursday\")\n    case 5:\n        print(\"Friday\")\n    case 6:\n        print(\"Saturday\")\n    case 7:\n        print(\"Sunday\")\n\n# ---------- Default value ----------\n# The underscore _ matches anything not matched before:\nday = 9\nmatch day:\n    case 6:\n        print(\"Today is Saturday\")\n    case 7:\n        print(\"Today is Sunday\")\n    case _:\n        print(\"Looking forward to the Weekend\")\n\n# ---------- Combine values with | (or) ----------\nday = 4\nmatch day:\n    case 1 | 2 | 3 | 4 | 5:\n        print(\"Today is a weekday\")\n    case 6 | 7:\n        print(\"I love weekends!\")\n\n# ---------- If statements as guards ----------\nmonth = 5\nday = 4\nmatch day:\n    case 1 | 2 | 3 | 4 | 5 if month == 4:\n        print(\"A weekday in April\")\n    case 1 | 2 | 3 | 4 | 5 if month == 5:\n        print(\"A weekday in May\")\n    case _:\n        print(\"No match\")\n", "18_Python_Match/README.md": "# 18. Python Match\n\nTopics in this folder (in order):\n\n1. Match - `01_match.py`\n", "19_Python_While_Loops/01_while_loops.py": "# ==========================================================\n# PYTHON WHILE LOOPS\n# ==========================================================\n# Python has two loop commands: while and for.\n# A while loop runs as long as its condition is true.\n\ni = 1\nwhile i < 6:\n    print(i)\n    i += 1          # don't forget this, or the loop runs forever!\n\n# ---------- break - stop the loop ----------\ni = 1\nwhile i < 6:\n    print(i)\n    if i == 3:\n        break\n    i += 1\n\n# ---------- continue - skip to the next iteration ----------\ni = 0\nwhile i < 6:\n    i += 1\n    if i == 3:\n        continue\n    print(i)\n\n# ---------- else - runs once when the condition becomes false ----------\ni = 1\nwhile i < 6:\n    print(i)\n    i += 1\nelse:\n    print(\"i is no longer less than 6\")\n", "19_Python_While_Loops/README.md": "# 19. Python While Loops\n\nTopics in this folder (in order):\n\n1. While Loops - `01_while_loops.py`\n", "20_Python_For_Loops/01_for_loops.py": "# ==========================================================\n# PYTHON FOR LOOPS\n# ==========================================================\n# A for loop iterates over a sequence (list, tuple, dict, set, string).\nfruits = [\"apple\", \"banana\", \"cherry\"]\nfor x in fruits:\n    print(x)\n\n# ---------- Looping through a string ----------\nfor x in \"banana\":\n    print(x)\n\n# ---------- break ----------\nfor x in fruits:\n    print(x)\n    if x == \"banana\":\n        break\n\n# break before print:\nfor x in fruits:\n    if x == \"banana\":\n        break\n    print(x)\n\n# ---------- continue ----------\nfor x in fruits:\n    if x == \"banana\":\n        continue\n    print(x)\n\n# ---------- range() ----------\nfor x in range(6):          # 0..5\n    print(x)\nfor x in range(2, 6):       # 2..5\n    print(x)\nfor x in range(2, 30, 3):   # step 3\n    print(x)\n\n# ---------- else in a for loop ----------\nfor x in range(6):\n    print(x)\nelse:\n    print(\"Finally finished!\")\n\n# else does NOT run if the loop was stopped by break:\nfor x in range(6):\n    if x == 3:\n        break\n    print(x)\nelse:\n    print(\"Finally finished!\")   # not printed\n\n# ---------- Nested loops ----------\nadj = [\"red\", \"big\", \"tasty\"]\nfor a in adj:\n    for f in fruits:\n        print(a, f)\n\n# ---------- pass ----------\nfor x in [0, 1, 2]:\n    pass\n", "20_Python_For_Loops/README.md": "# 20. Python For Loops\n\nTopics in this folder (in order):\n\n1. For Loops - `01_for_loops.py`\n", "21_Python_Functions/01_functions.py": "# ==========================================================\n# PYTHON FUNCTIONS\n# ==========================================================\n# A function is a block of code that only runs when it is called.\n# You can pass data (parameters) into it, and it can return data.\n\n# ---------- Creating a function ----------\ndef my_function():\n    print(\"Hello from a function\")\n\n# ---------- Calling a function ----------\nmy_function()\nmy_function()     # call it as many times as you like\n\n# ---------- Function names ----------\n# Same rules as variable names: start with a letter or _, then letters,\n# numbers, underscores. Use descriptive snake_case names: calculate_sum()\n\n# ---------- Why use functions? ----------\n# Write the code once, reuse it many times - instead of repeating yourself.\ndef fahrenheit_to_celsius(f):\n    return (f - 32) * 5 / 9\n\nprint(fahrenheit_to_celsius(77))\nprint(fahrenheit_to_celsius(95))\nprint(fahrenheit_to_celsius(50))\n\n# ---------- Return values ----------\ndef get_greeting():\n    return \"Hello from a function\"\n\nmessage = get_greeting()\nprint(message)\n\n# A function without a return statement returns None:\ndef no_return():\n    x = 1\n\nprint(no_return())\n\n# ---------- pass ----------\n# A function body cannot be empty; use pass as a placeholder.\ndef todo():\n    pass\n", "21_Python_Functions/02_arguments.py": "# ==========================================================\n# PYTHON FUNCTION ARGUMENTS\n# ==========================================================\n# Information passed into a function = arguments.\ndef my_function(fname):\n    print(fname + \" Refsnes\")\n\nmy_function(\"Emil\")\nmy_function(\"Tobias\")\n\n# Parameter = the variable in the definition (fname)\n# Argument  = the value sent when calling (\"Emil\")\n\n# ---------- Number of arguments ----------\n# Must match the number of parameters, unless defaults are given.\ndef full_name(fname, lname):\n    print(fname + \" \" + lname)\n\nfull_name(\"Emil\", \"Refsnes\")\n# full_name(\"Emil\")      # TypeError: missing 1 required argument\n\n# ---------- Default parameter values ----------\ndef my_country(country=\"Norway\"):\n    print(\"I am from \" + country)\n\nmy_country(\"Sweden\")\nmy_country()             # uses the default\n\n# ---------- Keyword arguments ----------\n# key = value syntax; the order does not matter.\ndef kids(child3, child2, child1):\n    print(\"The youngest child is \" + child3)\n\nkids(child1=\"Emil\", child2=\"Tobias\", child3=\"Linus\")\n\n# ---------- Positional + keyword ----------\n# Positional arguments must come BEFORE keyword arguments.\ndef describe(animal, name):\n    print(f\"I have a {animal} called {name}\")\n\ndescribe(\"dog\", name=\"Buddy\")\n\n# ---------- Passing different data types ----------\ndef show_items(food):\n    for x in food:\n        print(x)\n\nshow_items([\"apple\", \"banana\", \"cherry\"])\n\n# ---------- Return values ----------\ndef times5(x):\n    return 5 * x\n\nprint(times5(3))\n\n# ---------- Positional-only arguments  ( , / ) ----------\ndef pos_only(x, /):\n    print(x)\n\npos_only(3)\n# pos_only(x=3)   # TypeError\n\n# ---------- Keyword-only arguments  ( *, ) ----------\ndef kw_only(*, x):\n    print(x)\n\nkw_only(x=3)\n# kw_only(3)      # TypeError\n\n# ---------- Combining both ----------\ndef combined(a, b, /, *, c, d):\n    print(a + b + c + d)\n\ncombined(5, 6, c=7, d=8)\n", "21_Python_Functions/03_args_kwargs.py": "# ==========================================================\n# *args AND **kwargs\n# ==========================================================\n\n# ---------- *args - arbitrary positional arguments ----------\n# If you don't know how many arguments will be passed, add * before the\n# parameter name. The function receives a TUPLE of arguments.\ndef my_function(*kids):\n    print(\"The youngest child is \" + kids[2])\n\nmy_function(\"Emil\", \"Tobias\", \"Linus\")\n\ndef add_all(*numbers):\n    total = 0\n    for n in numbers:\n        total += n\n    return total\n\nprint(add_all(1, 2, 3))\nprint(add_all(10, 20, 30, 40, 50))\n\n# Regular parameters + *args:\ndef greet(greeting, *names):\n    for name in names:\n        print(greeting, name)\n\ngreet(\"Hello\", \"Emil\", \"Tobias\", \"Linus\")\n\n# ---------- **kwargs - arbitrary keyword arguments ----------\n# Add ** before the parameter name; the function receives a DICTIONARY.\ndef my_function2(**kid):\n    print(\"His last name is \" + kid[\"lname\"])\n\nmy_function2(fname=\"Tobias\", lname=\"Refsnes\")\n\ndef show_info(**info):\n    for key, value in info.items():\n        print(f\"{key}: {value}\")\n\nshow_info(name=\"Ravi\", age=36, city=\"Delhi\")\n\n# ---------- Combining them ----------\n# Order: regular params, *args, then **kwargs\ndef everything(title, *args, **kwargs):\n    print(\"title:\", title)\n    print(\"args:\", args)\n    print(\"kwargs:\", kwargs)\n\neverything(\"Demo\", 1, 2, 3, color=\"red\", size=\"L\")\n\n# ---------- Unpacking when CALLING ----------\ndef add3(a, b, c):\n    return a + b + c\n\nnums = [1, 2, 3]\nprint(add3(*nums))                # list -> positional arguments\n\nvalues = {\"a\": 1, \"b\": 2, \"c\": 3}\nprint(add3(**values))             # dict -> keyword arguments\n", "21_Python_Functions/04_scope.py": "# ==========================================================\n# PYTHON SCOPE\n# ==========================================================\n# A variable is only available inside the region where it is created.\n# That region is called its scope.\n\n# ---------- Local scope ----------\ndef myfunc():\n    x = 300           # local to myfunc\n    print(x)\n\nmyfunc()\n\n# ---------- Function inside a function ----------\n# The inner function can read the outer function's variables.\ndef outer():\n    x = 300\n    def inner():\n        print(x)\n    inner()\n\nouter()\n\n# ---------- Global scope ----------\nx = 300               # global\n\ndef myfunc2():\n    print(x)          # can read the global\n\nmyfunc2()\nprint(x)\n\n# ---------- Naming variables ----------\n# Same name inside and outside a function = two different variables.\nx = 300\n\ndef myfunc3():\n    x = 200\n    print(x)          # 200 (local)\n\nmyfunc3()\nprint(x)              # 300 (global)\n\n# ---------- global keyword ----------\ndef myfunc4():\n    global y\n    y = 300\n\nmyfunc4()\nprint(y)\n\nx = 300\ndef myfunc5():\n    global x\n    x = 200\n\nmyfunc5()\nprint(x)              # 200\n\n# ---------- nonlocal keyword ----------\n# Use the variable from the OUTER function (not global).\ndef myfunc6():\n    x = \"Jane\"\n    def myfunc7():\n        nonlocal x\n        x = \"hello\"\n    myfunc7()\n    return x\n\nprint(myfunc6())      # hello\n\n# ---------- The LEGB rule ----------\n# Python looks up names in this order:\n#   L - Local        (inside the current function)\n#   E - Enclosing    (inside enclosing functions)\n#   G - Global       (module level)\n#   B - Built-in     (print, len, ...)\n", "21_Python_Functions/05_decorators.py": "# ==========================================================\n# PYTHON DECORATORS\n# ==========================================================\n# A decorator lets you add extra behaviour to a function WITHOUT changing\n# the function's code. It is a function that takes a function and returns\n# a new function.\n\ndef changecase(func):\n    def wrapper():\n        return func().upper()\n    return wrapper\n\n@changecase                  # same as: myfunction = changecase(myfunction)\ndef myfunction():\n    return \"Hello Sally\"\n\nprint(myfunction())          # HELLO SALLY\n\n# ---------- Reuse a decorator on many functions ----------\n@changecase\ndef otherfunction():\n    return \"I am speed!\"\n\nprint(otherfunction())\n\n# ---------- Decorators with arguments (*args, **kwargs) ----------\ndef changecase2(func):\n    def wrapper(*args, **kwargs):\n        return func(*args, **kwargs).upper()\n    return wrapper\n\n@changecase2\ndef greet(name):\n    return \"Hello \" + name\n\nprint(greet(\"John\"))\n\n# ---------- Decorator with its own argument ----------\ndef repeat(times):\n    def decorator(func):\n        def wrapper(*args, **kwargs):\n            for _ in range(times):\n                func(*args, **kwargs)\n        return wrapper\n    return decorator\n\n@repeat(3)\ndef say_hi():\n    print(\"Hi!\")\n\nsay_hi()\n\n# ---------- Multiple decorators ----------\ndef addgreeting(func):\n    def wrapper(*args, **kwargs):\n        return \"Hello \" + func(*args, **kwargs)\n    return wrapper\n\n@changecase2\n@addgreeting               # applied first (closest to the function)\ndef myname(name):\n    return name\n\nprint(myname(\"Tobias\"))    # HELLO TOBIAS\n\n# ---------- Preserving function metadata ----------\n# A wrapper hides the original __name__ and docstring.\n# functools.wraps copies them back:\nimport functools\n\ndef logged(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        print(\"Calling\", func.__name__)\n        return func(*args, **kwargs)\n    return wrapper\n\n@logged\ndef add(a, b):\n    \"\"\"Add two numbers.\"\"\"\n    return a + b\n\nprint(add(2, 3))\nprint(add.__name__, \"-\", add.__doc__)\n", "21_Python_Functions/06_lambda.py": "# ==========================================================\n# PYTHON LAMBDA\n# ==========================================================\n# A lambda is a small anonymous function.\n# It can take any number of arguments, but has only ONE expression.\n#\n#   lambda arguments : expression\n\nx = lambda a: a + 10\nprint(x(5))\n\nx = lambda a, b: a * b\nprint(x(5, 6))\n\nx = lambda a, b, c: a + b + c\nprint(x(5, 6, 2))\n\n# ---------- Why use lambda? ----------\n# Lambdas shine when used as an anonymous function inside another function.\ndef myfunc(n):\n    return lambda a: a * n\n\nmydoubler = myfunc(2)\nmytripler = myfunc(3)\nprint(mydoubler(11))\nprint(mytripler(11))\n\n# ---------- Lambda with built-in functions ----------\nnumbers = [1, 2, 3, 4, 5, 6, 7, 8]\n\n# map() - apply to every item\ndoubled = list(map(lambda n: n * 2, numbers))\nprint(doubled)\n\n# filter() - keep items where the lambda returns True\nodd = list(filter(lambda n: n % 2 != 0, numbers))\nprint(odd)\n\n# sorted() with a key\nstudents = [(\"Emil\", 25), (\"Tobias\", 22), (\"Linus\", 28)]\nprint(sorted(students, key=lambda s: s[1]))\n\nwords = [\"apple\", \"pie\", \"banana\", \"cherry\"]\nprint(sorted(words, key=lambda w: len(w)))\n", "21_Python_Functions/07_recursion.py": "# ==========================================================\n# PYTHON RECURSION\n# ==========================================================\n# Recursion = a function that calls itself.\n# Every recursive function needs:\n#   - a BASE CASE that stops the recursion\n#   - a RECURSIVE CASE that moves toward the base case\n# Without a base case it would run until Python raises RecursionError.\n\ndef countdown(n):\n    if n <= 0:                # base case\n        print(\"Done!\")\n    else:\n        print(n)\n        countdown(n - 1)      # recursive case\n\ncountdown(5)\n\n# ---------- Factorial: 5! = 5*4*3*2*1 ----------\ndef factorial(n):\n    if n == 0 or n == 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(5))     # 120\n\n# ---------- Fibonacci ----------\ndef fibonacci(n):\n    if n <= 1:\n        return n\n    return fibonacci(n - 1) + fibonacci(n - 2)\n\nprint([fibonacci(i) for i in range(10)])\n\n# ---------- Recursion with lists ----------\ndef sum_list(items):\n    if len(items) == 0:\n        return 0\n    return items[0] + sum_list(items[1:])\n\nprint(sum_list([1, 2, 3, 4, 5]))\n\ndef find_max(items):\n    if len(items) == 1:\n        return items[0]\n    rest = find_max(items[1:])\n    return items[0] if items[0] > rest else rest\n\nprint(find_max([3, 7, 2, 9, 1]))\n\n# ---------- Recursion depth limit ----------\nimport sys\nprint(\"Default recursion limit:\", sys.getrecursionlimit())\n# For very deep problems a loop is usually better than recursion.\n", "21_Python_Functions/08_generators.py": "# ==========================================================\n# PYTHON GENERATORS\n# ==========================================================\n# A generator is a function that returns an iterator. It uses `yield`\n# to produce values ONE AT A TIME, pausing between them.\n# Values are created only when needed -> very memory efficient.\n\ndef my_generator():\n    yield 1\n    yield 2\n    yield 3\n\nfor value in my_generator():\n    print(value)\n\n# ---------- yield keyword ----------\n# yield returns a value and PAUSES the function; the next request\n# continues right after the yield.\ndef count_up_to(n):\n    count = 1\n    while count <= n:\n        yield count\n        count += 1\n\nfor num in count_up_to(5):\n    print(num)\n\n# ---------- Generators save memory ----------\n# This does not build a list of a million numbers in memory:\ndef large_sequence(n):\n    for i in range(n):\n        yield i\n\ngen = large_sequence(1_000_000)\nprint(next(gen))\nprint(next(gen))\nprint(next(gen))\n\n# ---------- next() ----------\ndef simple():\n    yield \"Emil\"\n    yield \"Tobias\"\n\ng = simple()\nprint(next(g))\nprint(next(g))\n# next(g) now would raise StopIteration\n\n# ---------- Generator expressions ----------\n# Like a list comprehension, but with ( ) - creates a generator.\nsquares_list = [x * x for x in range(5)]     # list\nsquares_gen = (x * x for x in range(5))      # generator\nprint(squares_list)\nprint(squares_gen)\nprint(sum(x * x for x in range(5)))          # handy inside functions\n\n# ---------- Fibonacci generator ----------\ndef fibonacci():\n    a, b = 0, 1\n    while True:              # infinite, but values are made one at a time\n        yield a\n        a, b = b, a + b\n\nfib = fibonacci()\nprint([next(fib) for _ in range(10)])\n\n# ---------- Generator methods ----------\n# send() - send a value back into the generator\ndef echo():\n    while True:\n        received = yield\n        print(\"Received:\", received)\n\ne = echo()\nnext(e)            # start the generator\ne.send(\"Hello\")\ne.send(\"World\")\n\n# close() - stop the generator\ndef numbers():\n    try:\n        yield 1\n        yield 2\n    finally:\n        print(\"Generator closed\")\n\nn = numbers()\nprint(next(n))\nn.close()\n", "21_Python_Functions/README.md": "# 21. Python Functions\n\nTopics in this folder (in order):\n\n1. Functions - `01_functions.py`\n2. Arguments - `02_arguments.py`\n3. *args **kwargs - `03_args_kwargs.py`\n4. Scope - `04_scope.py`\n5. Decorators - `05_decorators.py`\n6. Lambda - `06_lambda.py`\n7. Recursion - `07_recursion.py`\n8. Generators - `08_generators.py`\n", "22_Python_Range/01_range.py": "# ==========================================================\n# PYTHON RANGE\n# ==========================================================\n# range() returns an immutable sequence of numbers.\n# It is most often used to loop a specific number of times.\n#\n#   range(stop)\n#   range(start, stop)\n#   range(start, stop, step)\n# start is included, stop is NOT included. Default start = 0, step = 1.\n\n# ---------- One argument ----------\nx = range(10)\nprint(list(x))           # 0..9\n\n# ---------- Two arguments ----------\nx = range(3, 10)\nprint(list(x))           # 3..9\n\n# ---------- Three arguments ----------\nx = range(3, 10, 2)\nprint(list(x))           # 3, 5, 7, 9\n\n# Negative step - count down:\nprint(list(range(10, 0, -2)))\n\n# ---------- Range in for loops ----------\nfor i in range(5):\n    print(\"Loop number\", i)\n\n# ---------- Slicing a range ----------\nr = range(0, 20)\nprint(r[5:10])            # range(5, 10)\nprint(list(r[5:10]))\n\n# ---------- Membership test ----------\nr = range(0, 10, 2)\nprint(6 in r)             # True\nprint(7 in r)             # False\n\n# ---------- Length ----------\nprint(len(range(0, 10, 3)))   # 4\n\n# A range uses very little memory - it does not store all numbers,\n# it computes them when needed.\n", "22_Python_Range/README.md": "# 22. Python Range\n\nTopics in this folder (in order):\n\n1. Range - `01_range.py`\n", "23_Python_Arrays/01_arrays.py": "# ==========================================================\n# PYTHON ARRAYS\n# ==========================================================\n# Python has no built-in array type - LISTS are used instead.\n# (For real numeric arrays, use a library such as NumPy.)\n\ncars = [\"Ford\", \"Volvo\", \"BMW\"]\n\n# ---------- What is an array? ----------\n# A special variable that can hold more than one value at a time.\n# Instead of car1, car2, car3 ... you keep them in one array.\n\n# ---------- Access the elements ----------\nx = cars[0]\nprint(x)\n\n# ---------- Modify ----------\ncars[0] = \"Toyota\"\nprint(cars)\n\n# ---------- Length of an array ----------\nprint(len(cars))\n# The length is always one more than the highest index.\n\n# ---------- Looping ----------\nfor x in cars:\n    print(x)\n\n# ---------- Adding elements ----------\ncars.append(\"Honda\")\nprint(cars)\n\n# ---------- Removing elements ----------\ncars.pop(1)              # by index\nprint(cars)\ncars.remove(\"BMW\")       # by value (first match)\nprint(cars)\n\n# ---------- Array methods (list methods) ----------\n# append() clear() copy() count() extend() index() insert()\n# pop() remove() reverse() sort()\n\n# ---------- The array module ----------\n# For arrays of ONE numeric type, there is the built-in `array` module:\nimport array\nnums = array.array(\"i\", [1, 2, 3])   # \"i\" = signed integers\nnums.append(4)\nprint(nums, nums[0])\n", "23_Python_Arrays/README.md": "# 23. Python Arrays\n\nTopics in this folder (in order):\n\n1. Arrays - `01_arrays.py`\n", "24_Python_Iterators/01_iterators.py": "# ==========================================================\n# PYTHON ITERATORS\n# ==========================================================\n# An iterator is an object you can step through one value at a time.\n# It implements the iterator protocol: __iter__() and __next__().\n\n# ---------- Iterator vs Iterable ----------\n# Lists, tuples, dicts, sets and strings are ITERABLES:\n# you can get an iterator from them with iter().\nmytuple = (\"apple\", \"banana\", \"cherry\")\nmyit = iter(mytuple)\nprint(next(myit))\nprint(next(myit))\nprint(next(myit))\n\nmystr = \"banana\"\nmyit = iter(mystr)\nprint(next(myit), next(myit), next(myit))\n\n# ---------- Looping through an iterator ----------\n# A for loop creates an iterator and calls next() for you.\nfor x in mytuple:\n    print(x)\n\n# ---------- Create an iterator ----------\n# Give your class __iter__() and __next__():\nclass MyNumbers:\n    def __iter__(self):\n        self.a = 1\n        return self\n\n    def __next__(self):\n        x = self.a\n        self.a += 1\n        return x\n\nmyclass = MyNumbers()\nmyiter = iter(myclass)\nprint(next(myiter))\nprint(next(myiter))\nprint(next(myiter))\n\n# ---------- StopIteration ----------\n# Raise StopIteration to end the iteration (otherwise it never ends).\nclass UpToTwenty:\n    def __iter__(self):\n        self.a = 1\n        return self\n\n    def __next__(self):\n        if self.a <= 20:\n            x = self.a\n            self.a += 1\n            return x\n        raise StopIteration\n\nfor x in UpToTwenty():\n    print(x, end=\" \")\nprint()\n", "24_Python_Iterators/README.md": "# 24. Python Iterators\n\nTopics in this folder (in order):\n\n1. Iterators - `01_iterators.py`\n", "25_Python_Modules/01_modules.py": "# ==========================================================\n# PYTHON MODULES\n# ==========================================================\n# A module is like a code library: a file with functions / variables\n# you want to include in your program.\n\n# ---------- Create a module ----------\n# Save code in a file ending in .py -> see mymodule.py in this folder.\n\n# ---------- Use a module ----------\nimport mymodule\nmymodule.greeting(\"Jonathan\")       # module_name.function_name\n\n# ---------- Variables in a module ----------\na = mymodule.person1[\"age\"]\nprint(a)\n\n# ---------- Re-naming a module (alias) ----------\nimport mymodule as mx\nprint(mx.person1[\"country\"])\n\n# ---------- Built-in modules ----------\nimport platform\nprint(platform.system())\n\n# ---------- dir() - list everything defined in a module ----------\nprint(dir(platform)[:10], \"...\")\n\n# ---------- Import only part of a module ----------\nfrom mymodule import person1\nprint(person1[\"name\"])     # no module prefix needed now\n", "25_Python_Modules/README.md": "# 25. Python Modules\n\nTopics in this folder (in order):\n\n1. Modules - `01_modules.py`\n\n`mymodule.py` is the example module imported by `01_modules.py`.\n", "25_Python_Modules/mymodule.py": "# A module is just a .py file. This one is imported by 01_modules.py\n\ndef greeting(name):\n    print(\"Hello, \" + name)\n\nperson1 = {\n    \"name\": \"Ravi\",\n    \"age\": 36,\n    \"country\": \"India\"\n}\n", "26_Python_Dates/01_dates.py": "# ==========================================================\n# PYTHON DATES\n# ==========================================================\n# Dates are not a data type of their own - import the datetime module.\nimport datetime\n\nx = datetime.datetime.now()\nprint(x)                       # year, month, day, hour, minute, second, microsecond\n\n# ---------- Date output ----------\nprint(x.year)\nprint(x.strftime(\"%A\"))        # weekday name\n\n# ---------- Creating date objects ----------\nx = datetime.datetime(2020, 5, 17)    # year, month, day (time is optional)\nprint(x)\n\n# ---------- strftime() - format dates as readable strings ----------\nx = datetime.datetime(2018, 6, 1)\nprint(x.strftime(\"%B\"))        # June\n\n# Format codes:\nnow = datetime.datetime.now()\ncodes = {\n    \"%a\": \"Weekday, short\",          \"%A\": \"Weekday, full\",\n    \"%w\": \"Weekday as number 0-6\",   \"%d\": \"Day of month 01-31\",\n    \"%b\": \"Month name, short\",       \"%B\": \"Month name, full\",\n    \"%m\": \"Month as number 01-12\",   \"%y\": \"Year, short\",\n    \"%Y\": \"Year, full\",              \"%H\": \"Hour 00-23\",\n    \"%I\": \"Hour 00-12\",              \"%p\": \"AM/PM\",\n    \"%M\": \"Minute 00-59\",            \"%S\": \"Second 00-59\",\n    \"%f\": \"Microsecond\",             \"%j\": \"Day number of year\",\n    \"%U\": \"Week number (Sun first)\", \"%W\": \"Week number (Mon first)\",\n    \"%c\": \"Local date and time\",     \"%x\": \"Local date\",\n    \"%X\": \"Local time\",              \"%%\": \"A % character\",\n}\nfor code, meaning in codes.items():\n    print(f\"{code}  {meaning:28} {now.strftime(code)}\")\n", "26_Python_Dates/README.md": "# 26. Python Dates\n\nTopics in this folder (in order):\n\n1. Dates - `01_dates.py`\n", "27_Python_Math/01_math.py": "# ==========================================================\n# PYTHON MATH\n# ==========================================================\n\n# ---------- Built-in math functions ----------\nx = min(5, 10, 25)\ny = max(5, 10, 25)\nprint(x, y)\n\nprint(abs(-7.25))        # absolute (positive) value\nprint(pow(4, 3))         # 4 to the power of 3 = 64\n\n# ---------- The math module ----------\nimport math\n\nprint(math.sqrt(64))     # square root\nprint(math.ceil(1.4))    # round UP   -> 2\nprint(math.floor(1.4))   # round DOWN -> 1\nprint(math.pi)           # PI constant\n\n# A few more useful ones:\nprint(math.factorial(5))\nprint(math.gcd(12, 18))\nprint(math.isclose(0.1 + 0.2, 0.3))\nprint(math.log(math.e), math.log10(1000))\nprint(math.sin(math.pi / 2), math.cos(0))\nprint(math.inf, math.e)\n", "27_Python_Math/README.md": "# 27. Python Math\n\nTopics in this folder (in order):\n\n1. Math - `01_math.py`\n", "28_Python_JSON/01_json.py": "# ==========================================================\n# PYTHON JSON\n# ==========================================================\n# JSON is a text format for storing and exchanging data.\n# Python's built-in json module works with it.\nimport json\n\n# ---------- Parse JSON (JSON string -> Python) ----------\nx = '{ \"name\":\"Ravi\", \"age\":30, \"city\":\"Delhi\"}'\ny = json.loads(x)          # result is a Python dictionary\nprint(y[\"age\"])\n\n# ---------- Convert Python -> JSON ----------\nx = {\"name\": \"Ravi\", \"age\": 30, \"city\": \"Delhi\"}\ny = json.dumps(x)          # result is a JSON string\nprint(y)\n\n# These Python types can be converted to JSON:\nprint(json.dumps({\"name\": \"Ravi\", \"age\": 30}))   # dict  -> Object\nprint(json.dumps([\"apple\", \"bananas\"]))          # list  -> Array\nprint(json.dumps((\"apple\", \"bananas\")))          # tuple -> Array\nprint(json.dumps(\"hello\"))                       # str   -> String\nprint(json.dumps(42))                            # int   -> Number\nprint(json.dumps(31.76))                         # float -> Number\nprint(json.dumps(True))                          # True  -> true\nprint(json.dumps(False))                         # False -> false\nprint(json.dumps(None))                          # None  -> null\n\nx = {\n    \"name\": \"Ravi\",\n    \"age\": 30,\n    \"married\": True,\n    \"divorced\": False,\n    \"children\": (\"Ann\", \"Billy\"),\n    \"pets\": None,\n    \"cars\": [\n        {\"model\": \"BMW 230\", \"mpg\": 27.5},\n        {\"model\": \"Ford Edge\", \"mpg\": 24.1}\n    ]\n}\nprint(json.dumps(x))\n\n# ---------- Format the result ----------\nprint(json.dumps(x, indent=4))                          # indentation\nprint(json.dumps(x, indent=4, separators=(\". \", \" = \")))  # custom separators\n\n# ---------- Order the result ----------\nprint(json.dumps(x, indent=4, sort_keys=True))\n", "28_Python_JSON/README.md": "# 28. Python JSON\n\nTopics in this folder (in order):\n\n1. JSON - `01_json.py`\n", "29_Python_RegEx/01_regex.py": "# ==========================================================\n# PYTHON REGEX (Regular Expressions)\n# ==========================================================\n# A RegEx is a sequence of characters that forms a search pattern.\n# Python's built-in `re` module works with them.\nimport re\n\ntxt = \"The rain in Spain\"\nx = re.search(\"^The.*Spain$\", txt)\nprint(\"Match!\" if x else \"No match\")\n\n# ---------- RegEx functions ----------\n#   findall - list of all matches\n#   search  - Match object for the first match\n#   split   - list split at each match\n#   sub     - replace matches with a string\n\n# ---------- Metacharacters ----------\n#   []  a set of characters          \"[a-m]\"\n#   \\   special sequence / escape    \"\\d\"\n#   .   any character except newline \"he..o\"\n#   ^   starts with                  \"^hello\"\n#   $   ends with                    \"planet$\"\n#   *   zero or more                 \"he.*o\"\n#   +   one or more                  \"he.+o\"\n#   ?   zero or one                  \"he.?o\"\n#   {}  exactly this many            \"he.{2}o\"\n#   |   either or                    \"falls|stays\"\n#   ()  capture and group\n\n# ---------- Special sequences ----------\n#   \\A  match at the beginning      \\b  word boundary\n#   \\B  NOT a word boundary         \\d  digit 0-9\n#   \\D  not a digit                 \\s  whitespace\n#   \\S  not whitespace              \\w  word character [a-zA-Z0-9_]\n#   \\W  not a word character        \\Z  match at the end\n\n# ---------- Sets ----------\n#   [arn]   one of a, r, n          [a-n]  lowercase a..n\n#   [^arn]  anything except a,r,n   [0123] one of these digits\n#   [0-9]   any digit               [0-5][0-9] two-digit 00..59\n#   [a-zA-Z] any letter             [+]    a literal +\n\n# ---------- findall() ----------\nprint(re.findall(\"ai\", txt))          # ['ai', 'ai']\nprint(re.findall(\"Portugal\", txt))    # []\n\n# ---------- search() ----------\nx = re.search(r\"\\s\", txt)\nprint(\"First white-space at position:\", x.start())\nprint(re.search(\"Portugal\", txt))     # None\n\n# ---------- split() ----------\nprint(re.split(r\"\\s\", txt))\nprint(re.split(r\"\\s\", txt, maxsplit=1))\n\n# ---------- sub() ----------\nprint(re.sub(r\"\\s\", \"9\", txt))\nprint(re.sub(r\"\\s\", \"9\", txt, count=2))\n\n# ---------- Match object ----------\nx = re.search(r\"\\bS\\w+\", txt)\nprint(x.span())      # (start, end) of the match\nprint(x.string)      # the string passed in\nprint(x.group())     # the matched part\n", "29_Python_RegEx/README.md": "# 29. Python RegEx\n\nTopics in this folder (in order):\n\n1. RegEx - `01_regex.py`\n", "30_Python_PIP/01_pip.py": "# ==========================================================\n# PYTHON PIP\n# ==========================================================\n# PIP is the package manager for Python packages (modules).\n# It is included with Python 3.4 and later.\n#\n# A PACKAGE contains all the files needed for a module.\n# Packages are found at https://pypi.org\n#\n# Run these commands in a TERMINAL (not inside Python):\n#\n#   Check PIP is installed:     pip --version\n#   Download a package:         pip install camelcase\n#   Remove a package:           pip uninstall camelcase\n#   List installed packages:    pip list\n#   Upgrade a package:          pip install --upgrade camelcase\n#   Save requirements:          pip freeze > requirements.txt\n#   Install from requirements:  pip install -r requirements.txt\n#\n# After installing, use a package with import:\n#\n#   import camelcase\n#   c = camelcase.CamelCase()\n#   print(c.hump(\"hello world\"))     # Hello World\n\n# This script shows which packages are installed, using only the standard library:\nfrom importlib import metadata\n\ndists = sorted(metadata.distributions(), key=lambda d: (d.metadata[\"Name\"] or \"\").lower())\nprint(f\"{len(dists)} packages installed. First few:\")\nfor d in dists[:10]:\n    print(\" \", d.metadata[\"Name\"], d.version)\n", "30_Python_PIP/README.md": "# 30. Python PIP\n\nTopics in this folder (in order):\n\n1. PIP - `01_pip.py`\n", "31_Python_Try_Except/01_try_except.py": "# ==========================================================\n# PYTHON TRY ... EXCEPT\n# ==========================================================\n#   try     - test a block of code for errors\n#   except  - handle the error\n#   else    - run code when there was NO error\n#   finally - run code no matter what\n\n# ---------- Exception handling ----------\n# Without try, an error stops the program. With try, we can handle it:\ntry:\n    print(undefined_variable)\nexcept:\n    print(\"An exception occurred\")\n\n# ---------- Many exceptions ----------\ntry:\n    print(undefined_variable)\nexcept NameError:\n    print(\"Variable is not defined\")\nexcept:\n    print(\"Something else went wrong\")\n\n# ---------- else ----------\ntry:\n    print(\"Hello\")\nexcept:\n    print(\"Something went wrong\")\nelse:\n    print(\"Nothing went wrong\")\n\n# ---------- finally ----------\ntry:\n    print(undefined_variable)\nexcept:\n    print(\"Something went wrong\")\nfinally:\n    print(\"The 'try except' is finished\")\n\n# finally is useful for closing resources:\nimport os, tempfile\npath = os.path.join(tempfile.gettempdir(), \"demo_try.txt\")\nf = open(path, \"w\")\ntry:\n    f.write(\"Lorum Ipsum\")\nexcept:\n    print(\"Something went wrong when writing to the file\")\nfinally:\n    f.close()\n    os.remove(path)\n\n# ---------- Getting the error message ----------\ntry:\n    10 / 0\nexcept ZeroDivisionError as e:\n    print(\"Error:\", e)\n\n# ---------- Raise an exception ----------\nx = -1\ntry:\n    if x < 0:\n        raise Exception(\"Sorry, no numbers below zero\")\nexcept Exception as e:\n    print(e)\n\nx = \"hello\"\ntry:\n    if not type(x) is int:\n        raise TypeError(\"Only integers are allowed\")\nexcept TypeError as e:\n    print(e)\n", "31_Python_Try_Except/README.md": "# 31. Python Try...Except\n\nTopics in this folder (in order):\n\n1. Try Except - `01_try_except.py`\n", "32_Python_String_Formatting/01_string_formatting.py": "# ==========================================================\n# PYTHON STRING FORMATTING\n# ==========================================================\n\n# ---------- F-Strings (preferred, Python 3.6+) ----------\ntxt = f\"The price is 49 dollars\"\nprint(txt)\n\n# ---------- Placeholders and modifiers ----------\nprice = 59\nprint(f\"The price is {price} dollars\")\nprint(f\"The price is {price:.2f} dollars\")          # 2 decimals\nprint(f\"The price is {95:.2f} dollars\")             # a literal value\n\n# ---------- Perform operations ----------\nprint(f\"The price is {20 * 59} dollars\")\n\nprice = 59\ntax = 0.25\nprint(f\"The price is {price + (price * tax)} dollars\")\n\n# if...else inside the placeholder\nprint(f\"It is very {'Expensive' if price > 50 else 'Cheap'}\")\n\n# ---------- Execute functions ----------\nfruit = \"apples\"\nprint(f\"I love {fruit.upper()}\")\n\ndef myconverter(x):\n    return x * 0.3048\n\nprint(f\"The plane is flying at a {myconverter(30000)} meter altitude\")\n\n# ---------- More modifiers ----------\nprice = 59000\nprint(f\"The price is {price:,} dollars\")    # thousand separator\nprint(f\"{'left':<10}|\")                     # left align in 10 spaces\nprint(f\"{'right':>10}|\")                    # right align\nprint(f\"{'center':^10}|\")                   # center\nprint(f\"{0.25:%}  {0.25:.0%}\")              # percentage\nprint(f\"{255:b} {255:o} {255:x} {255:X}\")   # binary, octal, hex\nprint(f\"{12345.678:e}\")                     # scientific\nprint(f\"{42:05d}\")                          # pad with zeros\n\n# ---------- String format() ----------\n# The older way, still widely used:\nprice = 49\ntxt = \"The price is {} dollars\"\nprint(txt.format(price))\n\ntxt = \"The price is {:.2f} dollars\"\nprint(txt.format(price))\n\n# Multiple values\nquantity, itemno, price = 3, 567, 49\nmyorder = \"I want {} pieces of item number {} for {:.2f} dollars.\"\nprint(myorder.format(quantity, itemno, price))\n\n# Index numbers\nmyorder = \"I want {0} pieces of item number {1} for {2:.2f} dollars.\"\nprint(myorder.format(quantity, itemno, price))\n\nage, name = 36, \"Ravi\"\ntxt = \"His name is {1}. {1} is {0} years old.\"\nprint(txt.format(age, name))\n\n# Named indexes\nmyorder = \"I have a {carname}, it is a {model}.\"\nprint(myorder.format(carname=\"Ford\", model=\"Mustang\"))\n", "32_Python_String_Formatting/README.md": "# 32. Python String Formatting\n\nTopics in this folder (in order):\n\n1. String Formatting - `01_string_formatting.py`\n", "33_Python_None/01_none.py": "# ==========================================================\n# PYTHON NONE\n# ==========================================================\n# None is a special constant that means \"no value\" / \"nothing\".\n# It is the only value of the NoneType type.\nx = None\nprint(x)\nprint(type(x))\n\n# ---------- Comparing with None ----------\n# Use `is` (or `is not`) to check for None, not ==\nresult = None\nif result is None:\n    print(\"No result yet\")\nelse:\n    print(\"Result:\", result)\n\nresult = 42\nif result is not None:\n    print(\"Result:\", result)\n\n# ---------- None is falsy ----------\nprint(bool(None))              # False\nif not None:\n    print(\"None counts as False in conditions\")\n\n# But None is not the same as 0, \"\" or False:\nprint(None == 0, None == \"\", None == False)\n\n# ---------- Functions return None by default ----------\ndef greet():\n    print(\"Hello!\")\n\nvalue = greet()\nprint(\"greet() returned:\", value)\n\n# ---------- None as a default parameter ----------\n# A common pattern for \"argument not given\":\ndef add_item(item, items=None):\n    if items is None:\n        items = []          # create a NEW list each call\n    items.append(item)\n    return items\n\nprint(add_item(\"apple\"))\nprint(add_item(\"banana\"))\n", "33_Python_None/README.md": "# 33. Python None\n\nTopics in this folder (in order):\n\n1. None - `01_none.py`\n", "34_Python_User_Input/01_user_input.py": "# ==========================================================\n# PYTHON USER INPUT\n# ==========================================================\n# input() asks the user for input and waits until they press Enter.\n# The program stops at input() until the user responds.\n\nusername = input(\"Enter username: \")\nprint(\"Username is: \" + username)\n\n# ---------- Using a prompt ----------\nname = input(\"Enter your name: \")\nprint(f\"Hello {name}\")\n\n# ---------- input() always returns a STRING ----------\n# Convert it if you need a number:\nage = input(\"Enter your age: \")\nprint(type(age))                     # <class 'str'>\n\ntry:\n    age = int(age)\n    print(\"Next year you will be\", age + 1)\nexcept ValueError:\n    print(\"That was not a whole number\")\n\n# ---------- Validate input: keep asking until it is valid ----------\nwhile True:\n    num = input(\"Enter a number between 1 and 10: \")\n    if num.isdigit() and 1 <= int(num) <= 10:\n        print(\"Thanks! You entered\", num)\n        break\n    print(\"Wrong input, try again.\")\n", "34_Python_User_Input/README.md": "# 34. Python User Input\n\nTopics in this folder (in order):\n\n1. User Input - `01_user_input.py`\n", "35_Python_VirtualEnv/01_virtualenv.py": "# ==========================================================\n# PYTHON VIRTUAL ENVIRONMENTS\n# ==========================================================\n# A virtual environment is an isolated Python setup for one project.\n# Each project gets its own packages and versions, so projects don't\n# conflict with each other.\n#\n# Run these commands in a TERMINAL:\n#\n# ---------- Create a virtual environment ----------\n#   python -m venv myfirstproject\n#   (creates a folder \"myfirstproject\" with its own Python + pip)\n#\n# ---------- Activate it ----------\n#   Windows:        myfirstproject\\Scripts\\activate\n#   Mac / Linux:    source myfirstproject/bin/activate\n#   The prompt now shows (myfirstproject) at the start.\n#\n# ---------- Install packages (only inside this environment) ----------\n#   pip install cowsay\n#\n# ---------- Use the package ----------\n#   python -c \"import cowsay; cowsay.tux('Hello')\"\n#\n# ---------- Deactivate ----------\n#   deactivate\n#\n# ---------- Delete ----------\n#   Just delete the environment folder.\n#\n# Tip: don't commit the venv folder to git - save your packages with\n#   pip freeze > requirements.txt\n\n# This script tells you whether it is running inside a virtual environment:\nimport sys\nin_venv = sys.prefix != sys.base_prefix\nprint(\"Running inside a virtual environment:\", in_venv)\nprint(\"Python prefix:\", sys.prefix)\n", "35_Python_VirtualEnv/README.md": "# 35. Python VirtualEnv\n\nTopics in this folder (in order):\n\n1. VirtualEnv - `01_virtualenv.py`\n", "36_Python_OOP/01_oop.py": "# ==========================================================\n# PYTHON OOP (Object-Oriented Programming)\n# ==========================================================\n# OOP organises code around OBJECTS that bundle data (attributes)\n# and behaviour (methods).\n#\n# Advantages:\n#   - gives programs a clear structure\n#   - keeps code DRY (Don't Repeat Yourself) - easier to maintain\n#   - makes it easy to reuse code\n#   - lets you build complex programs from simple pieces\n#\n# Classes and objects:\n#   A CLASS is a template/blueprint.  An OBJECT is an instance of it.\n#\n#   class: Fruit       -> objects: Apple, Banana, Mango\n#   class: Car         -> objects: Volvo, Audi, Toyota\n#\n# Each object gets the class's variables and functions.\n#\n# The four pillars covered in the next folders:\n#   Classes/Objects, Inheritance, Polymorphism, Encapsulation\n\nclass Fruit:\n    def __init__(self, name):\n        self.name = name\n\n    def describe(self):\n        print(\"This is a\", self.name)\n\napple = Fruit(\"Apple\")\nbanana = Fruit(\"Banana\")\napple.describe()\nbanana.describe()\n", "36_Python_OOP/README.md": "# 36. Python OOP\n\nTopics in this folder (in order):\n\n1. OOP - `01_oop.py`\n", "37_Python_Classes_Objects/01_classes_objects.py": "# ==========================================================\n# PYTHON CLASSES / OBJECTS\n# ==========================================================\n# Almost everything in Python is an object, with properties and methods.\n# A class is an object constructor - a \"blueprint\" for creating objects.\n\n# ---------- Create a class ----------\nclass MyClass:\n    x = 5\n\nprint(MyClass)\n\n# ---------- Create an object ----------\np1 = MyClass()\nprint(p1.x)\n\n# ---------- Delete an object ----------\np2 = MyClass()\ndel p2\n# print(p2)   # NameError\n\n# ---------- Multiple objects ----------\n# Each object is independent:\np1 = MyClass()\np2 = MyClass()\np3 = MyClass()\np2.x = 10\nprint(p1.x, p2.x, p3.x)\n\n# ---------- The pass statement ----------\n# A class definition cannot be empty:\nclass Person:\n    pass\n", "37_Python_Classes_Objects/README.md": "# 37. Python Classes/Objects\n\nTopics in this folder (in order):\n\n1. Classes Objects - `01_classes_objects.py`\n", "38_Python_init_Method/01_init_method.py": "# ==========================================================\n# PYTHON __init__() METHOD\n# ==========================================================\n# All classes have a built-in method __init__(), which runs automatically\n# whenever a new object is created. Use it to set the object's values.\n\nclass Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\np1 = Person(\"Emil\", 36)\nprint(p1.name)\nprint(p1.age)\n\n# ---------- Why use __init__()? ----------\n# Without it, you'd have to set attributes manually on every object:\nclass PersonNoInit:\n    pass\n\np = PersonNoInit()\np.name = \"Tobias\"\np.age = 25\nprint(p.name, p.age)\n# __init__ makes sure every object starts with the data it needs.\n\n# ---------- Default values ----------\nclass Person2:\n    def __init__(self, name, age=18):\n        self.name = name\n        self.age = age\n\nprint(Person2(\"Emil\").age)        # 18 (default)\nprint(Person2(\"Linus\", 30).age)   # 30\n\n# ---------- Multiple parameters ----------\nclass Car:\n    def __init__(self, brand, model, year, color=\"black\"):\n        self.brand = brand\n        self.model = model\n        self.year = year\n        self.color = color\n\nc = Car(\"Ford\", \"Mustang\", 1964, \"red\")\nprint(c.brand, c.model, c.year, c.color)\n", "38_Python_init_Method/README.md": "# 38. Python __init__ Method\n\nTopics in this folder (in order):\n\n1. __init__ Method - `01_init_method.py`\n", "39_Python_self_Parameter/01_self_parameter.py": "# ==========================================================\n# PYTHON self PARAMETER\n# ==========================================================\n# `self` is a reference to the CURRENT instance of the class.\n# It is used to access the object's attributes and methods.\n# It must be the first parameter of every instance method.\n\nclass Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def greet(self):\n        print(\"Hello, my name is \" + self.name)\n\np1 = Person(\"Emil\", 25)\np1.greet()          # Python passes p1 as self automatically\n\n# ---------- Why self? ----------\n# Without self, methods could not tell WHICH object's data to use.\np2 = Person(\"Tobias\", 30)\np2.greet()\n\n# ---------- Accessing properties with self ----------\nclass Car:\n    def __init__(self, brand, model):\n        self.brand = brand\n        self.model = model\n\n    def display(self):\n        print(self.brand + \" \" + self.model)\n\nCar(\"Toyota\", \"Corolla\").display()\n\n# ---------- Calling other methods with self ----------\nclass Calculator:\n    def add(self, a, b):\n        return a + b\n\n    def add_and_double(self, a, b):\n        return self.add(a, b) * 2\n\nprint(Calculator().add_and_double(2, 3))\n\n# ---------- self is just a convention ----------\n# You can name it anything (but please don't - always use self):\nclass Weird:\n    def __init__(this, name):\n        this.name = name\n\n    def show(abc):\n        print(\"Name:\", abc.name)\n\nWeird(\"Linus\").show()\n", "39_Python_self_Parameter/README.md": "# 39. Python self Parameter\n\nTopics in this folder (in order):\n\n1. self Parameter - `01_self_parameter.py`\n", "40_Python_Class_Properties/01_class_properties.py": "# ==========================================================\n# PYTHON CLASS PROPERTIES\n# ==========================================================\n# Properties (attributes) are the variables that belong to a class/object.\n\nclass Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\np1 = Person(\"Emil\", 36)\n\n# ---------- Access properties ----------\nprint(p1.name, p1.age)\n\n# ---------- Modify properties ----------\np1.age = 40\nprint(p1.age)\n\n# ---------- Delete properties ----------\ndel p1.age\n# print(p1.age)   # AttributeError\n\n# ---------- Class properties vs instance properties ----------\n#   Instance properties - defined in __init__ with self, unique per object\n#   Class properties    - defined directly in the class, SHARED by all objects\nclass Dog:\n    species = \"Canis familiaris\"      # class property\n\n    def __init__(self, name):\n        self.name = name              # instance property\n\nd1 = Dog(\"Buddy\")\nd2 = Dog(\"Max\")\nprint(d1.name, d1.species)\nprint(d2.name, d2.species)\n\n# ---------- Modifying class properties ----------\nDog.species = \"Wolf-ish\"              # change for ALL objects\nprint(d1.species, d2.species)\n\n# ---------- Add new properties ----------\nd1.age = 3                            # only d1 gets this property\nprint(d1.age)\nprint(hasattr(d2, \"age\"))             # False\n", "40_Python_Class_Properties/README.md": "# 40. Python Class Properties\n\nTopics in this folder (in order):\n\n1. Class Properties - `01_class_properties.py`\n", "41_Python_Class_Methods/01_class_methods.py": "# ==========================================================\n# PYTHON CLASS METHODS\n# ==========================================================\n# Methods are functions that belong to a class/object.\n\nclass Person:\n    def __init__(self, name):\n        self.name = name\n\n    def greet(self):\n        print(\"Hello, my name is \" + self.name)\n\np1 = Person(\"Emil\")\np1.greet()\n\n# ---------- Methods with parameters ----------\nclass Calculator:\n    def add(self, a, b):\n        return a + b\n\n    def multiply(self, a, b):\n        return a * b\n\ncalc = Calculator()\nprint(calc.add(5, 3))\nprint(calc.multiply(4, 7))\n\n# ---------- Methods that change properties ----------\nclass Account:\n    def __init__(self, owner, balance=0):\n        self.owner = owner\n        self.balance = balance\n\n    def deposit(self, amount):\n        self.balance += amount\n\n    def show(self):\n        print(f\"{self.owner}: {self.balance}\")\n\nacc = Account(\"Ravi\")\nacc.deposit(500)\nacc.show()\n\n# ---------- The __str__() method ----------\n# Controls what is shown when the object is printed.\nclass Person2:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def __str__(self):\n        return f\"{self.name} ({self.age})\"\n\nprint(Person2(\"Tobias\", 36))\n\n# ---------- @classmethod and @staticmethod ----------\nclass Pizza:\n    count = 0\n\n    def __init__(self, topping):\n        self.topping = topping\n        Pizza.count += 1\n\n    @classmethod                 # receives the CLASS (cls), not the object\n    def margherita(cls):\n        return cls(\"tomato & mozzarella\")\n\n    @staticmethod                # receives neither - a plain helper function\n    def is_valid_size(size):\n        return size in (\"S\", \"M\", \"L\")\n\np = Pizza.margherita()\nprint(p.topping, \"| pizzas made:\", Pizza.count)\nprint(Pizza.is_valid_size(\"M\"))\n\n# ---------- Delete methods ----------\nclass Temp:\n    def hello(self):\n        print(\"hello\")\n\ndel Temp.hello\n# Temp().hello()   # AttributeError\n", "41_Python_Class_Methods/README.md": "# 41. Python Class Methods\n\nTopics in this folder (in order):\n\n1. Class Methods - `01_class_methods.py`\n", "42_Python_Magic_Methods/01_magic_methods.py": "# ==========================================================\n# PYTHON MAGIC METHODS (dunder methods)\n# ==========================================================\n# Magic methods have double underscores at the start and end (__init__).\n# Python calls them automatically for built-in operations:\n#\n#   __init__      object creation          Point(1, 2)\n#   __str__       print() / str()          print(p)\n#   __repr__      repr() / developer view  repr(p)\n#   __eq__        ==                       p1 == p2\n#   __lt__        <                        p1 < p2\n#   __add__       +                        p1 + p2\n#   __len__       len()                    len(obj)\n#   __contains__  in                       x in obj\n#   __call__      calling like a function  obj()\n#\n# Each has its own file in this folder.\n\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __str__(self):\n        return f\"Point({self.x}, {self.y})\"\n\n    def __add__(self, other):\n        return Point(self.x + other.x, self.y + other.y)\n\n    def __eq__(self, other):\n        return self.x == other.x and self.y == other.y\n\na = Point(1, 2)\nb = Point(3, 4)\nprint(a + b)\nprint(a == Point(1, 2))\n\n# See all magic methods an object supports:\nprint([m for m in dir(a) if m.startswith(\"__\")][:12], \"...\")\n", "42_Python_Magic_Methods/02_str.py": "# ==========================================================\n# __str__\n# ==========================================================\n# __str__ returns a readable string for the object.\n# Used by print() and str().\n\nclass Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\np = Person(\"Emil\", 36)\nprint(p)               # <__main__.Person object at 0x...>  - not useful\n\nclass Person2:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def __str__(self):\n        return f\"{self.name} is {self.age} years old\"\n\np = Person2(\"Emil\", 36)\nprint(p)               # Emil is 36 years old\nprint(str(p))\nprint(f\"Info: {p}\")    # f-strings use __str__ too\n", "42_Python_Magic_Methods/03_repr.py": "# ==========================================================\n# __repr__\n# ==========================================================\n# __repr__ returns an unambiguous, developer-friendly string -\n# ideally one that looks like the code to re-create the object.\n# Used by repr(), the interactive shell, and inside lists.\n\nclass Book:\n    def __init__(self, title, pages):\n        self.title = title\n        self.pages = pages\n\n    def __repr__(self):\n        return f\"Book({self.title!r}, {self.pages})\"\n\n    def __str__(self):\n        return f\"{self.title} ({self.pages} pages)\"\n\nb = Book(\"Python Basics\", 250)\nprint(repr(b))          # Book('Python Basics', 250)\nprint(b)                # uses __str__\nprint([b, Book(\"Advanced Python\", 400)])   # lists show __repr__\n\n# If only __repr__ is defined, print() falls back to it.\n", "42_Python_Magic_Methods/04_eq.py": "# ==========================================================\n# __eq__\n# ==========================================================\n# __eq__ defines what == means for your objects.\n# Without it, == checks if both are the SAME object.\n\nclass Plain:\n    def __init__(self, x):\n        self.x = x\n\nprint(Plain(1) == Plain(1))     # False - different objects\n\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __eq__(self, other):\n        if not isinstance(other, Point):\n            return NotImplemented\n        return self.x == other.x and self.y == other.y\n\nprint(Point(1, 2) == Point(1, 2))   # True\nprint(Point(1, 2) == Point(2, 1))   # False\nprint(Point(1, 2) != Point(2, 1))   # True (!= uses __eq__ automatically)\nprint(Point(1, 2) == \"text\")        # False\n", "42_Python_Magic_Methods/05_add.py": "# ==========================================================\n# __add__\n# ==========================================================\n# __add__ defines what + does for your objects.\n\nclass Money:\n    def __init__(self, amount):\n        self.amount = amount\n\n    def __add__(self, other):\n        return Money(self.amount + other.amount)\n\n    def __str__(self):\n        return f\"Rs {self.amount}\"\n\na = Money(100)\nb = Money(250)\nprint(a + b)            # Rs 350\n\n# Related operator methods:\n#   __sub__  -     __mul__  *     __truediv__  /\n#   __floordiv__ //   __mod__ %   __pow__ **\nclass Vector:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n\n    def __add__(self, o):\n        return Vector(self.x + o.x, self.y + o.y)\n\n    def __sub__(self, o):\n        return Vector(self.x - o.x, self.y - o.y)\n\n    def __mul__(self, n):\n        return Vector(self.x * n, self.y * n)\n\n    def __str__(self):\n        return f\"Vector({self.x}, {self.y})\"\n\nv = Vector(2, 3)\nw = Vector(1, 1)\nprint(v + w, v - w, v * 3)\n", "42_Python_Magic_Methods/06_len.py": "# ==========================================================\n# __len__\n# ==========================================================\n# __len__ lets len() work on your object. It must return an int >= 0.\n\nclass Playlist:\n    def __init__(self, songs):\n        self.songs = songs\n\n    def __len__(self):\n        return len(self.songs)\n\np = Playlist([\"Song A\", \"Song B\", \"Song C\"])\nprint(len(p))           # 3\n\n# An object with __len__ returning 0 is treated as False:\nempty = Playlist([])\nif not empty:\n    print(\"The playlist is empty\")\n", "42_Python_Magic_Methods/07_lt.py": "# ==========================================================\n# __lt__\n# ==========================================================\n# __lt__ defines < (less than). With it, sorted() and min()/max()\n# can work on your objects.\n\nclass Student:\n    def __init__(self, name, grade):\n        self.name = name\n        self.grade = grade\n\n    def __lt__(self, other):\n        return self.grade < other.grade\n\n    def __repr__(self):\n        return f\"{self.name}:{self.grade}\"\n\na = Student(\"Emil\", 85)\nb = Student(\"Tobias\", 92)\nprint(a < b)            # True\nprint(b > a)            # True - Python flips it and uses __lt__\n\nstudents = [b, Student(\"Linus\", 78), a]\nprint(sorted(students))\nprint(min(students), max(students))\n\n# Related: __le__ <=   __gt__ >   __ge__ >=\n", "42_Python_Magic_Methods/08_contains.py": "# ==========================================================\n# __contains__\n# ==========================================================\n# __contains__ defines how the `in` operator works for your object.\n\nclass Team:\n    def __init__(self, members):\n        self.members = members\n\n    def __contains__(self, name):\n        return name.lower() in (m.lower() for m in self.members)\n\nteam = Team([\"Emil\", \"Tobias\", \"Linus\"])\nprint(\"tobias\" in team)        # True (case-insensitive, our own rule)\nprint(\"Ravi\" in team)          # False\nprint(\"Ravi\" not in team)      # True\n", "42_Python_Magic_Methods/09_call.py": "# ==========================================================\n# __call__\n# ==========================================================\n# __call__ makes an object callable like a function: obj()\n\nclass Multiplier:\n    def __init__(self, factor):\n        self.factor = factor\n\n    def __call__(self, x):\n        return x * self.factor\n\ndouble = Multiplier(2)\ntriple = Multiplier(3)\nprint(double(5))        # 10\nprint(triple(5))        # 15\nprint(callable(double)) # True\n\n# Useful for objects that remember state between calls:\nclass Counter:\n    def __init__(self):\n        self.count = 0\n\n    def __call__(self):\n        self.count += 1\n        return self.count\n\nc = Counter()\nc(); c()\nprint(c())              # 3\n", "42_Python_Magic_Methods/README.md": "# 42. Python Magic Methods\n\nTopics in this folder (in order):\n\n1. Magic Methods - `01_magic_methods.py`\n2. __str__ - `02_str.py`\n3. __repr__ - `03_repr.py`\n4. __eq__ - `04_eq.py`\n5. __add__ - `05_add.py`\n6. __len__ - `06_len.py`\n7. __lt__ - `07_lt.py`\n8. __contains__ - `08_contains.py`\n9. __call__ - `09_call.py`\n", "43_Python_Inheritance/01_inheritance.py": "# ==========================================================\n# PYTHON INHERITANCE\n# ==========================================================\n# Inheritance lets a class take all the methods and properties of another.\n#   Parent (base) class  - the class being inherited from\n#   Child (derived) class - the class that inherits\n\n# ---------- Create a parent class ----------\nclass Person:\n    def __init__(self, fname, lname):\n        self.firstname = fname\n        self.lastname = lname\n\n    def printname(self):\n        print(self.firstname, self.lastname)\n\nx = Person(\"John\", \"Doe\")\nx.printname()\n\n# ---------- Create a child class ----------\nclass Student(Person):\n    pass\n\nx = Student(\"Mike\", \"Olsen\")\nx.printname()            # inherited from Person\n\n# ---------- Add __init__() to the child ----------\n# The child's __init__ OVERRIDES the parent's. To keep the parent's\n# behaviour, call it explicitly:\nclass Student2(Person):\n    def __init__(self, fname, lname):\n        Person.__init__(self, fname, lname)\n\n# ---------- super() ----------\n# super() refers to the parent without naming it:\nclass Student3(Person):\n    def __init__(self, fname, lname, year):\n        super().__init__(fname, lname)\n        self.graduationyear = year          # add a property\n\n    def welcome(self):                      # add a method\n        print(\"Welcome\", self.firstname, self.lastname,\n              \"to the class of\", self.graduationyear)\n\nx = Student3(\"Mike\", \"Olsen\", 2019)\nprint(x.graduationyear)\nx.welcome()\n\n# A child method with the same name as a parent method overrides it.\nprint(isinstance(x, Person), issubclass(Student3, Person))\n", "43_Python_Inheritance/README.md": "# 43. Python Inheritance\n\nTopics in this folder (in order):\n\n1. Inheritance - `01_inheritance.py`\n", "44_Python_Polymorphism/01_polymorphism.py": "# ==========================================================\n# PYTHON POLYMORPHISM\n# ==========================================================\n# Polymorphism = \"many forms\": the same method/function name used on\n# different types.\n\n# ---------- Function polymorphism ----------\n# len() works on many types:\nprint(len(\"Hello World!\"))                       # string\nprint(len((\"apple\", \"banana\", \"cherry\")))        # tuple\nprint(len({\"brand\": \"Ford\", \"model\": \"Mustang\"}))# dict\n\n# ---------- Class polymorphism ----------\n# Different classes with methods of the same name:\nclass Car:\n    def __init__(self, brand, model):\n        self.brand, self.model = brand, model\n    def move(self):\n        print(\"Drive!\")\n\nclass Boat:\n    def __init__(self, brand, model):\n        self.brand, self.model = brand, model\n    def move(self):\n        print(\"Sail!\")\n\nclass Plane:\n    def __init__(self, brand, model):\n        self.brand, self.model = brand, model\n    def move(self):\n        print(\"Fly!\")\n\nfor x in (Car(\"Ford\", \"Mustang\"), Boat(\"Ibiza\", \"Touring 20\"), Plane(\"Boeing\", \"747\")):\n    x.move()\n\n# ---------- Inheritance class polymorphism ----------\nclass Vehicle:\n    def __init__(self, brand, model):\n        self.brand = brand\n        self.model = model\n    def move(self):\n        print(\"Move!\")\n\nclass Car2(Vehicle):\n    pass                       # uses Vehicle.move()\n\nclass Boat2(Vehicle):\n    def move(self):            # overrides move()\n        print(\"Sail!\")\n\nclass Plane2(Vehicle):\n    def move(self):\n        print(\"Fly!\")\n\nfor x in (Car2(\"Ford\", \"Mustang\"), Boat2(\"Ibiza\", \"Touring 20\"), Plane2(\"Boeing\", \"747\")):\n    print(x.brand, x.model, end=\": \")\n    x.move()\n", "44_Python_Polymorphism/README.md": "# 44. Python Polymorphism\n\nTopics in this folder (in order):\n\n1. Polymorphism - `01_polymorphism.py`\n", "45_Python_Encapsulation/01_encapsulation.py": "# ==========================================================\n# PYTHON ENCAPSULATION\n# ==========================================================\n# Encapsulation = bundling data and methods together, and protecting the\n# data from being changed directly from outside.\n\n# ---------- Private properties ( __name ) ----------\n# Two underscores make a property private (name-mangled by Python).\nclass Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.__age = age          # private\n\np1 = Person(\"Emil\", 25)\nprint(p1.name)\n# print(p1.__age)                # AttributeError\n\n# ---------- Getter / setter methods ----------\nclass Person2:\n    def __init__(self, name, age):\n        self.name = name\n        self.__age = age\n\n    def get_age(self):\n        return self.__age\n\n    def set_age(self, age):\n        if age > 0:               # validation!\n            self.__age = age\n        else:\n            print(\"Age must be positive\")\n\np = Person2(\"Tobias\", 25)\nprint(p.get_age())\np.set_age(26)\nprint(p.get_age())\np.set_age(-5)\n\n# ---------- Why encapsulation? ----------\n# - protects data from invalid values\n# - lets you change the inner details without breaking other code\n# - controls how data is read and written\nclass BankAccount:\n    def __init__(self, balance=0):\n        self.__balance = balance\n\n    def deposit(self, amount):\n        if amount > 0:\n            self.__balance += amount\n\n    def withdraw(self, amount):\n        if 0 < amount <= self.__balance:\n            self.__balance -= amount\n        else:\n            print(\"Insufficient funds\")\n\n    def get_balance(self):\n        return self.__balance\n\nacc = BankAccount(1000)\nacc.deposit(500)\nacc.withdraw(2000)\nprint(acc.get_balance())\n\n# ---------- Protected properties ( _name ) ----------\n# One underscore = \"internal use\" by convention. Python does not block it.\nclass Person3:\n    def __init__(self, name, salary):\n        self.name = name\n        self._salary = salary\n\nprint(Person3(\"Linus\", 50000)._salary)   # works, but you shouldn't\n\n# ---------- Private methods ----------\nclass Calculator:\n    def __validate(self, n):\n        return isinstance(n, (int, float))\n\n    def add(self, a, b):\n        if self.__validate(a) and self.__validate(b):\n            return a + b\n        return None\n\nprint(Calculator().add(5, 3))\n\n# ---------- Name mangling ----------\n# __age actually becomes _Person__age - private by convention, not truly hidden.\nprint(p1._Person__age)\n\n# ---------- @property - Pythonic getters/setters ----------\nclass Temperature:\n    def __init__(self, celsius):\n        self.celsius = celsius\n\n    @property\n    def celsius(self):\n        return self.__celsius\n\n    @celsius.setter\n    def celsius(self, value):\n        if value < -273.15:\n            raise ValueError(\"Below absolute zero!\")\n        self.__celsius = value\n\nt = Temperature(25)\nt.celsius = 30           # uses the setter\nprint(t.celsius)         # uses the getter\n", "45_Python_Encapsulation/README.md": "# 45. Python Encapsulation\n\nTopics in this folder (in order):\n\n1. Encapsulation - `01_encapsulation.py`\n", "46_Python_Inner_Classes/01_inner_classes.py": "# ==========================================================\n# PYTHON INNER CLASSES\n# ==========================================================\n# An inner (nested) class is a class defined inside another class.\n# Use it to group classes that only make sense together.\n\nclass Outer:\n    def __init__(self):\n        self.name = \"Outer Class\"\n\n    class Inner:\n        def __init__(self):\n            self.name = \"Inner Class\"\n\n        def display(self):\n            print(\"This is the inner class\")\n\nouter = Outer()\nprint(outer.name)\n\n# ---------- Accessing the inner class from outside ----------\ninner = Outer.Inner()\ninner.display()\nprint(inner.name)\n\n# ---------- Accessing the outer class from the inner class ----------\n# The inner class has no automatic link to an outer OBJECT - pass it in:\nclass Outer2:\n    def __init__(self):\n        self.name = \"Emil\"\n\n    class Inner:\n        def __init__(self, outer):\n            self.outer = outer\n\n        def display(self):\n            print(\"Outer name:\", self.outer.name)\n\no = Outer2()\ni = o.Inner(o)\ni.display()\n\n# ---------- Practical example ----------\nclass Car:\n    def __init__(self, brand, model):\n        self.brand = brand\n        self.model = model\n        self.engine = self.Engine()\n\n    class Engine:\n        def __init__(self):\n            self.status = \"Off\"\n\n        def start(self):\n            self.status = \"Running\"\n            print(\"Engine started\")\n\n        def stop(self):\n            self.status = \"Off\"\n            print(\"Engine stopped\")\n\n    def drive(self):\n        if self.engine.status == \"Running\":\n            print(f\"Driving the {self.brand} {self.model}\")\n        else:\n            print(\"Start the e
