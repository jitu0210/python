<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Learning – Code Browser &amp; Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --panel:#0b0b0b; --panel2:#111; --line:#222; --text:#e8e8e8; --muted:#8a8a8a;
          --accent:#7FFF00; --accent-dim:rgba(127,255,0,.12);
          --kw:#7FFF00; --str:#f9e2af; --num:#fab387; --com:#6c7086; --fn:#89dceb; --bi:#f5a6d6; --op:#cba6f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Outfit',system-ui,'Segoe UI',sans-serif; background:var(--bg); color:var(--text);
         display:grid; grid-template-columns:300px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:16px 12px; }
  aside h1 { font-size:20px; font-weight:700; margin:0 6px 14px; color:var(--accent); }
  #search { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text);
            font:inherit; font-size:14px; margin-bottom:12px; outline:none; }
  #search:focus { border-color:var(--accent); }
  details { margin:2px 0; }
  summary { cursor:pointer; padding:6px 8px; border-radius:6px; font-weight:500; font-size:14px; }
  summary:hover { background:var(--panel2); }
  details[open] > summary { color:var(--accent); }
  aside a { display:block; padding:5px 8px 5px 22px; color:var(--muted); text-decoration:none; font-size:14px; border-radius:6px; border-left:2px solid transparent; }
  aside a:hover { color:var(--text); background:var(--panel2); }
  aside a.active { color:var(--accent); background:var(--accent-dim); border-left-color:var(--accent); font-weight:500; }
  mark { background:var(--accent); color:#000; border-radius:2px; padding:0 1px; }
  main { overflow:auto; padding:24px 32px; }
  .crumb { color:var(--muted); font-size:13px; margin-bottom:6px; font-family:'Fira Code',monospace; }
  h2.title { margin:0 0 18px; font-size:28px; font-weight:600; text-transform:capitalize; }
  h2.title::after { content:''; display:block; width:48px; height:3px; background:var(--accent); border-radius:2px; margin-top:8px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:20px; overflow:hidden; }
  .box-head { display:flex; justify-content:space-between; align-items:center; padding:9px 14px; border-bottom:1px solid var(--line);
              font-size:14px; color:var(--text); font-weight:500; background:var(--panel2); }
  pre.code { margin:0; padding:14px 0; overflow:auto; font:14px/1.6 'Fira Code',Consolas,monospace; }
  pre.code .ln { display:inline-block; width:46px; padding-right:14px; text-align:right; color:#444; user-select:none; }
  .kw{color:var(--kw);font-weight:500} .str{color:var(--str)} .num{color:var(--num)} .com{color:var(--com);font-style:italic}
  .fn{color:var(--fn)} .bi{color:var(--bi)} .op{color:var(--op)}
  .editwrap { position:relative; height:320px; resize:vertical; overflow:hidden; background:#050505; }
  .editwrap pre, .editwrap textarea { position:absolute; inset:0; margin:0; padding:14px; border:0; white-space:pre; overflow:auto;
               font:14px/1.6 'Fira Code',Consolas,monospace; tab-size:4; }
  .editwrap pre { pointer-events:none; color:var(--text); }
  .editwrap textarea { background:transparent; color:transparent; caret-color:var(--accent); resize:none; outline:none; }
  .editwrap textarea::selection { background:rgba(127,255,0,.25); color:transparent; }
  #output { margin:0; padding:14px; min-height:60px; max-height:400px; overflow:auto; font:14px/1.6 'Fira Code',Consolas,monospace; white-space:pre-wrap; }
  #output .err { color:#f38ba8; }
  button { background:var(--accent); color:#000; border:0; padding:6px 16px; border-radius:7px; cursor:pointer; font:600 13px 'Outfit',sans-serif; margin-left:6px; }
  button:hover { background:#9dff40; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  button.ghost:hover { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  .md { padding:6px 22px 14px; line-height:1.7; font-size:15px; }
  .md h2, .md h3, .md h4 { color:var(--accent); font-weight:600; }
  .md b { color:#fff; }
  .md code { background:var(--accent-dim); color:var(--accent); padding:1px 6px; border-radius:4px; font:13px 'Fira Code',monospace; }
  .md pre { background:#050505; border:1px solid var(--line); padding:12px; border-radius:8px; overflow:auto; }
  .md pre code { padding:0; background:none; color:var(--text); }
  .md a, .chapter-links a { color:var(--accent); }
  .md table { border-collapse:collapse; } .md td { border:1px solid var(--line); padding:6px 10px; }
  .md tr:first-child td { background:var(--panel2); font-weight:600; }
  .hint { color:var(--muted); font-size:12px; font-weight:400; }
  ::selection { background:var(--accent); color:#000; }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:5px; } ::-webkit-scrollbar-thumb:hover { background:#3a3a3a; }
  @media (max-width:800px){ body{grid-template-columns:1fr; height:auto;} aside{max-height:40vh;} }
</style>
</head>
<body>
<aside>
  <h1>🐍 Python Learning</h1>
  <input id="search" placeholder="Search files…">
  <nav id="tree"></nav>
</aside>
<main>
  <div class="crumb" id="crumb"></div>
  <h2 class="title" id="title">Select a file</h2>
  <div id="notes"></div>
  <div class="box" id="codeBox" style="display:none">
    <div class="box-head"><span>📄 Code (read only)</span><button class="ghost" id="copyBtn">Copy</button></div>
    <pre class="code" id="code"></pre>
  </div>
  <div class="box">
    <div class="box-head">
      <span>▶ Python Playground <span class="hint">(edit freely · Ctrl+Enter to run · runs in your browser)</span></span>
      <span><button class="ghost" id="resetBtn">Reset</button><button id="runBtn">Run ▶</button></span>
    </div>
    <div class="editwrap"><pre id="editHL" aria-hidden="true"></pre><textarea id="editor" wrap="off" spellcheck="false" placeholder="# write Python here and press Run&#10;print('Hello, World!')"></textarea></div>
  </div>
  <div class="box">
    <div class="box-head"><span>🖥 Output</span><button class="ghost" id="clearBtn">Clear</button></div>
    <pre id="output"><span class="hint">Output will appear here.</span></pre>
  </div>
</main>

<script id="files" type="application/json">__FILES_JSON__</script>
<script>
const FILES = JSON.parse(document.getElementById('files').textContent);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pretty = s => s.replace(/^\d+_/, '').replace(/_/g, ' ').replace(/\.py$/, '');
let current = null;

/* ---------- sidebar with hyperlinks ---------- */
function buildTree(filter = '') {
  const groups = {};
  for (const path of Object.keys(FILES)) {
    if (filter && !path.toLowerCase().includes(filter) && !FILES[path].toLowerCase().includes(filter)) continue;
    const dir = path.includes('/') ? path.split('/')[0] : '(root)';
    (groups[dir] ||= []).push(path);
  }
  $('tree').innerHTML = Object.keys(groups).sort().map(dir => `
    <details ${filter || (current && current.startsWith(dir + '/')) ? 'open' : ''}>
      <summary>${esc(dir === '(root)' ? 'Home' : dir.replace(/_/g, ' '))}</summary>
      ${groups[dir].sort((a, b) => a.endsWith('README.md') ? -1 : b.endsWith('README.md') ? 1 : a.localeCompare(b)).map(p =>
        `<a href="#${encodeURIComponent(p)}" class="${p === current ? 'active' : ''}">${p.endsWith('.md') ? '📘 Notes' : '📄 ' + esc(pretty(p.split('/').pop()))}</a>`).join('')}
    </details>`).join('');
}
$('search').oninput = e => buildTree(e.target.value.trim().toLowerCase());

/* ---------- tiny Python highlighter ---------- */
const KW = new Set('False None True and as assert async await break case class continue def del elif else except finally for from global if import in is lambda match nonlocal not or pass raise return try while with yield'.split(' '));
const BI = new Set('print len range int str float bool list dict set tuple type input open isinstance enumerate zip map filter sorted sum min max abs round super self frozenset iter next id repr format any all'.split(' '));
function highlight(code, lines = true) {
  const re = /("""[\s\S]*?"""|'''[\s\S]*?'''|[rbfuRBFU]{0,2}"(?:\\.|[^"\\\n])*"|[rbfuRBFU]{0,2}'(?:\\.|[^'\\\n])*'|#[^\n]*|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b|[-+*/%=<>!&|^~]+)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = m[0], e = esc(t);
    if (t[0] === '#') out += `<span class="com">${e}</span>`;
    else if (/^[rbfuRBFU]{0,2}["']/.test(t)) out += `<span class="str">${e}</span>`;
    else if (/^[-+*/%=<>!&|^~]+$/.test(t)) out += `<span class="op">${e}</span>`;
    else if (/^\d/.test(t)) out += `<span class="num">${e}</span>`;
    else if (KW.has(t)) out += `<span class="kw">${e}</span>`;
    else if (BI.has(t)) out += `<span class="bi">${e}</span>`;
    else if (code[re.lastIndex] === '(') out += `<span class="fn">${e}</span>`;
    else out += e;
    last = re.lastIndex;
  }
  out += esc(code.slice(last));
  if (!lines) return out + '\n';
  return out.split('\n').map((l, i) => `<span class="ln">${i + 1}</span>${l}`).join('\n');
}

/* ---------- tiny markdown renderer for README notes ---------- */
function md(src) {
  const blocks = [];
  src = src.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, c) => {
    blocks.push(`<pre><code>${lang.startsWith('py') ? highlight(c.replace(/\n$/, ''), false) : esc(c)}</code></pre>`);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${/^https?:/.test(u) ? u : '#' + encodeURIComponent(u.replace(/^\.\//, ''))}">${t}</a>`);
  let html = '', list = false, table = false;
  for (const line of src.split('\n')) {
    const isLi = /^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line);
    const isTr = /^\s*\|/.test(line);
    if (list && !isLi) { html += '</ul>'; list = false; }
    if (table && !isTr) { html += '</table>'; table = false; }
    let m;
    if ((m = line.match(/^\u0000(\d+)\u0000$/))) html += blocks[m[1]];
    else if ((m = line.match(/^(#{1,6})\s+(.*)/))) html += `<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`;
    else if (isLi) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(line.replace(/^\s*([-*]|\d+\.)\s+/, ''))}</li>`; }
    else if (isTr) { if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue; if (!table) { html += '<table>'; table = true; }
      html += '<tr>' + line.trim().replace(/^\||\|$/g, '').split('|').map(c => `<td>${inline(c.trim())}</td>`).join('') + '</tr>'; }
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  if (list) html += '</ul>'; if (table) html += '</table>';
  return html.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

/* ---------- open a file ---------- */
function open_(path) {
  if (!(path in FILES)) path = 'README.md';
  current = path;
  const dir = path.includes('/') ? path.split('/')[0] : '';
  $('crumb').textContent = path;
  buildTree($('search').value.trim().toLowerCase());
  document.querySelector('aside a.active')?.scrollIntoView({ block: 'nearest' });
  if (path.endsWith('.py')) {
    $('title').textContent = pretty(path.split('/').pop());
    const readme = FILES[(dir ? dir + '/' : '') + 'README.md'];
    $('notes').innerHTML = '';
    $('codeBox').style.display = '';
    $('code').innerHTML = highlight(FILES[path]);
    $('editor').value = FILES[path]; syncHL();
  } else {
    $('title').textContent = dir ? dir.replace(/_/g, ' ') + ' – Notes' : 'Home';
    $('notes').innerHTML = `<div class="box md">${md(FILES[path])}</div>`;
    const firstPy = Object.keys(FILES).find(p => p.startsWith(dir + '/') && p.endsWith('.py'));
    if (dir && firstPy) $('notes').innerHTML += `<p class="chapter-links">Code in this chapter: ${Object.keys(FILES).filter(p => p.startsWith(dir + '/') && p.endsWith('.py'))
      .map(p => `<a href="#${encodeURIComponent(p)}">${esc(p.split('/').pop())}</a>`).join(' · ')}</p>`;
    $('codeBox').style.display = 'none';
  }
  $('main')?.scrollTo?.(0, 0);
}
window.onhashchange = () => open_(decodeURIComponent(location.hash.slice(1)));
$('copyBtn').onclick = () => navigator.clipboard.writeText(FILES[current] || '');
$('resetBtn').onclick = () => { $('editor').value = current?.endsWith('.py') ? FILES[current] : ''; syncHL(); };
$('clearBtn').onclick = () => { $('output').innerHTML = ''; };
$('editor').addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + '    ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 4; syncHL(); }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});

/* ---------- Python interpreter (Pyodide, loaded on first Run) ---------- */
let pyodide = null;
function write(text, cls) {
  const s = document.createElement('span'); if (cls) s.className = cls;
  s.textContent = text + '\n'; $('output').appendChild(s); $('output').scrollTop = 1e9;
}
async function loadPy() {
  if (pyodide) return pyodide;
  write('⏳ Loading Python (first time only, needs internet)…', 'hint');
  await new Promise((ok, fail) => { const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js'; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
  pyodide = await loadPyodide();
  // put every repo .py file into the virtual file system so imports like `import mymodule` work
  for (const [p, c] of Object.entries(FILES)) {
    const parts = p.split('/'); let d = '/repo';
    try { pyodide.FS.mkdir(d); } catch {}
    for (const seg of parts.slice(0, -1)) { d += '/' + seg; try { pyodide.FS.mkdir(d); } catch {} }
    pyodide.FS.writeFile('/repo/' + p, c);
  }
  pyodide.setStdout({ batched: t => write(t) });
  pyodide.setStderr({ batched: t => write(t, 'err') });
  pyodide.globals.set('js_prompt', (msg) => prompt(msg ?? '') ?? '');
  await pyodide.runPythonAsync(`import builtins\ndef _inp(msg=''):\n    print(msg, end='')\n    v = js_prompt(str(msg))\n    print(v)\n    return v\nbuiltins.input = _inp`);
  $('output').innerHTML = '';
  return pyodide;
}
async function run() {
  const btn = $('runBtn'); btn.disabled = true;
  try {
    const py = await loadPy();
    $('output').innerHTML = '';
    const dir = current && current.includes('/') ? '/repo/' + current.split('/')[0] : '/repo';
    py.globals.set('_code', $('editor').value);
    py.globals.set('_dir', dir);
    await py.runPythonAsync(`
import os, sys, traceback
os.chdir(_dir)
if _dir not in sys.path: sys.path.insert(0, _dir)
for _m in [m for m, v in list(sys.modules.items()) if getattr(v, '__file__', '') and str(getattr(v, '__file__', '')).startswith('/repo')]:
    del sys.modules[_m]
try:
    exec(compile(_code, '<playground>', 'exec'), {'__name__': '__main__'})
except SystemExit:
    pass
except BaseException:
    tb = traceback.format_exc().split('\\n')
    print('\\n'.join(l for l in tb if 'pyodide' not in l and '_pyodide' not in l), file=sys.stderr)
`);
    if (!$('output').textContent) write('(no output)', 'hint');
  } catch (e) { write(String(e), 'err'); }
  btn.disabled = false;
}
$('runBtn').onclick = run;
function syncHL() { $('editHL').innerHTML = highlight($('editor').value, false); $('editHL').scrollTop = $('editor').scrollTop; $('editHL').scrollLeft = $('editor').scrollLeft; }
$('editor').addEventListener('input', syncHL);
$('editor').addEventListener('scroll', () => { $('editHL').scrollTop = $('editor').scrollTop; $('editHL').scrollLeft = $('editor').scrollLeft; });

open_(decodeURIComponent(location.hash.slice(1)) || 'README.md');
</script>
</body>
</html>
